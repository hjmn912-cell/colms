<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>آلة حاسبة الأسطر المتعددة</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 5px;
            overflow: hidden;
        }

        .calculator-container {
            width: 100%;
            height: 95vh;
            max-width: 100%;
            background-color: #111827;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid #1f2937;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .sticky-top-section {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #030712;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            flex-shrink: 0;
        }

        .top-controls-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid #1f2937;
            gap: 10px;
            position: relative;
            flex-wrap: wrap;
        }

        .options-dropdown {
            position: relative;
            display: inline-block;
        }

        .options-btn {
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .options-btn:hover {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .options-dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 110%;
            background-color: #1e293b;
            min-width: 190px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.5);
            border-radius: 6px;
            z-index: 2000;
            border: 1px solid #38bdf8;
            padding: 10px 12px;
            flex-direction: column;
            gap: 10px;
        }

        .options-dropdown-content.active {
            display: flex;
        }

        .option-toggle-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            font-size: 0.95rem;
            color: #f8fafc;
            white-space: nowrap;
        }

        .option-toggle-label input {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: #38bdf8;
        }

        .totals-summary-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
        }

        .sub-totals-row {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 1.3rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .summary-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #38bdf8;
        }

        .positive-sum {
            color: #10b981;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .negative-sum {
            color: #ef4444;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .calculator-header {
            background-color: #030712;
            padding: 12px 15px;
            border-bottom: 2px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 10px;
            position: relative;
        }

        .total-value-container {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 6px;
            flex: 2;
            white-space: nowrap;
            overflow: visible;
        }

        .total-value {
            font-size: 2rem;
            font-weight: 700;
            color: #38bdf8;
            white-space: nowrap;
        }

        .total-currency {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: 600;
            white-space: nowrap;
        }

        .total-value.negative {
            color: #ef4444 !important;
        }

        .header-right-group {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-end;
        }

        .designer-credit {
            font-size: 0.75rem;
            color: #6b7280;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .top-action-btn, .top-notes-focus-btn {
            background-color: #1e293b;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .top-action-btn:active, .top-notes-focus-btn:active {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .export-dropdown {
            position: relative;
            display: inline-block;
            text-align: left;
        }

        .export-btn {
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .export-btn:hover {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            left: 0;
            background-color: #1e293b;
            min-width: 140px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.5);
            border-radius: 6px;
            z-index: 2000;
            border: 1px solid #38bdf8;
            overflow: hidden;
        }

        .dropdown-content button {
            color: #f8fafc;
            padding: 10px 14px;
            text-decoration: none;
            display: block;
            width: 100%;
            text-align: right;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .dropdown-content button:hover {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .export-dropdown.active .dropdown-content {
            display: block;
        }

        .calculator-screen {
            background-color: #0f172a;
            padding: 15px 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: auto;
            gap: 12px;
            width: 100%;
            -webkit-overflow-scrolling: touch;
        }

        .calc-row {
            display: flex;
            flex-direction: column;
            background-color: #1e293b;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid transparent;
            transition: border-color 0.2s;
            gap: 10px;
            width: 100%;
            min-width: 500px;
        }

        .calc-row.active {
            border-color: #38bdf8;
            background-color: #1e293b;
        }

        .calc-row-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .inputs-group {
            display: flex;
            gap: 8px;
            flex-grow: 1;
            align-items: center;
        }

        .text-input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .calc-input-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
        }

        .row-toggle-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #38bdf8;
            flex-shrink: 0;
        }

        .row-pad-checkbox {
            width: 13px;
            height: 13px;
            cursor: pointer;
            accent-color: #10b981;
            flex-shrink: 0;
        }

        .row-mobile-arrow-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            font-size: 0.9rem;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .row-mobile-arrow-btn:active {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .row-keypad-container {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            padding-top: 5px;
            position: relative;
        }

        .row-mini-keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background-color: #030712;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #38bdf8;
            width: 100%;
            max-width: 380px;
            direction: ltr;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            touch-action: none;
            cursor: grab;
            user-select: none;
        }

        .row-mini-keypad:active {
            cursor: grabbing;
        }

        .keypad-header {
            grid-column: span 4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            background-color: #1e293b;
            padding: 6px 10px;
            border-radius: 6px;
        }

        .keypad-drag-title {
            color: #38bdf8;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .close-keypad-btn {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        .close-keypad-btn:hover {
            background-color: #ef4444;
            color: #fff;
        }

        .mini-key-btn {
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 10px 4px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
            text-align: center;
            transition: all 0.2s;
            user-select: none;
        }

        .mini-key-btn:hover {
            background-color: #38bdf8;
            color: #0b0f19;
            border-color: #38bdf8;
        }

        .mini-key-btn.op {
            background-color: #0f172a;
            color: #38bdf8;
            border-color: #38bdf8;
        }

        .mini-key-btn.backspace {
            background-color: #331f29;
            color: #ef4444;
            border-color: #ef4444;
        }

        .mini-key-btn.backspace:hover {
            background-color: #ef4444;
            color: #fff;
        }

        .mini-key-btn.enter-key {
            background-color: #065f46;
            color: #34d399;
            border-color: #059669;
            font-size: 1.1rem;
        }

        .mini-key-btn.enter-key:hover {
            background-color: #10b981;
            color: #ffffff;
        }

        .mini-key-btn.kbd-key {
            background-color: #1e1b4b;
            color: #818cf8;
            border-color: #6366f1;
            font-size: 0.85rem;
        }

        .mini-key-btn.kbd-key:hover {
            background-color: #6366f1;
            color: #ffffff;
        }

        .mini-key-btn.nav-key {
            background-color: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            font-size: 0.9rem;
        }

        .mini-key-btn.nav-key:hover {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .mini-key-btn.clear-key {
            background-color: #7f1d1d;
            color: #fca5a5;
            border-color: #ef4444;
            font-size: 0.9rem;
        }

        .mini-key-btn.clear-key:hover {
            background-color: #ef4444;
            color: #ffffff;
        }

        .text-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 6px 10px;
            color: #38bdf8;
            font-size: 1.3rem;
            font-weight: bold;
            flex: 1;
            outline: none;
            font-family: inherit;
            resize: none;
            overflow-y: hidden;
            min-height: 42px;
            line-height: 1.3;
        }

        .calc-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 6px 10px;
            color: #38bdf8;
            font-size: 1.3rem;
            font-weight: bold;
            width: 100%;
            outline: none;
            font-family: inherit;
            height: 42px;
            direction: ltr;
            text-align: right;
        }

        .calc-input:focus, .text-input:focus {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.05);
        }

        .calc-row.hidden-calc .calc-input {
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .calc-output-container {
            display: flex;
            align-items: baseline;
            gap: 6px;
            min-width: 120px;
            text-align: left;
            white-space: nowrap;
        }

        .calc-output {
            font-size: 1.3rem;
            font-weight: 700;
            color: #10b981;
            white-space: nowrap;
        }

        .row-currency {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: 600;
            white-space: nowrap;
        }

        .calc-output.negative {
            color: #ef4444 !important;
        }

        .mic-btn, .delete-row-btn {
            background: transparent;
            border: none;
            color: #6b7280;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .mic-btn:hover {
            background-color: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
        }

        .mic-btn.listening {
            color: #ef4444 !important;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .delete-row-btn:hover {
            background-color: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .keyboard-hint {
            padding: 8px 15px;
            text-align: center;
            font-size: 0.8rem;
            color: #6b7280;
            background-color: #111827;
            border-top: 1px solid #1f2937;
            width: 100%;
            flex-shrink: 0;
        }

        .keyboard-hint span {
            color: #38bdf8;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .calculator-header {
                flex-direction: column;
                gap: 5px;
                padding: 10px;
            }
            .total-value-container {
                width: 100%;
                justify-content: center;
            }
            .total-value {
                font-size: 1.8rem;
            }
            .text-input, .calc-input, .calc-output, .summary-item, .positive-sum, .negative-sum {
                font-size: 1.1rem;
                height: 38px;
                min-height: 38px;
            }
            .header-right-group {
                width: 100%;
                justify-content: space-between;
            }
            .designer-credit {
                font-size: 0.7rem;
            }
        }

        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            html, body { display:block !important; min-height:0 !important; height:auto !important; margin:0 !important; padding:0 !important; overflow:visible !important; background:#fff !important; color:#000 !important; }
            .calculator-container { width:100% !important; height:auto !important; max-width:none !important; overflow:visible !important; box-shadow:none !important; border:0 !important; background:#fff !important; }
            .sticky-top-section { position:static !important; overflow:visible !important; background:#fff !important; }
            .calculator-screen { display:block !important; height:auto !important; max-height:none !important; overflow:visible !important; padding:0 !important; background:#fff !important; }
            .calc-row { display:flex !important; width:100% !important; break-inside:avoid !important; page-break-inside:avoid !important; background:#fff !important; color:#000 !important; border:1px solid #bbb !important; }
            .inputs-group { display:flex !important; min-width:0 !important; }
            .row-toggle-checkbox, .row-pad-checkbox, .row-mobile-arrow-btn, .row-keypad-container { display:none !important; }
            .text-input, .calc-input { height:auto !important; min-height:34px !important; overflow:visible !important; white-space:pre-wrap !important; overflow-wrap:anywhere !important; color:#000 !important; background:#fff !important; border:1px solid #bbb !important; -webkit-text-fill-color:#000 !important; visibility:visible !important; font-size:16px !important; }
            .calc-output-container, .calc-output, .row-currency, .total-value, .total-currency, .summary-item, .positive-sum, .negative-sum { color:#000 !important; overflow-wrap:anywhere !important; word-break:break-word !important; }
            .top-controls-wrapper, .export-dropdown, .mic-btn, .delete-row-btn, .keyboard-hint { display:none !important; }
        }

    </style>
</head>
<body>

    <div class="calculator-container" id="calculatorContainer">
        
        <div class="sticky-top-section">
            <div class="top-controls-wrapper">
                <div class="options-dropdown" id="optionsDropdown">
                    <button class="options-btn" type="button" onclick="toggleOptionsMenu(event)">
                        الخيارات <span>▼</span>
                    </button>
                    <div class="options-dropdown-content" id="optionsDropdownContent">
                        <label class="option-toggle-label">
                            <input type="checkbox" id="showCurrencyCheckbox" checked onchange="renderCalculator()">
                            إظهار كلمة جنيه
                        </label>
                    </div>
                </div>

                <div class="totals-summary-bar">
                    <div class="sub-totals-row">
                        <div class="summary-item">
                            <input type="checkbox" id="showPositiveCheckbox" onchange="renderCalculator()">
                            <span id="positiveTotalVal" class="positive-sum"></span>
                        </div>
                        <div class="summary-item">
                            <input type="checkbox" id="showNegativeCheckbox" onchange="renderCalculator()">
                            <span id="negativeTotalVal" class="negative-sum"></span>
                        </div>
                    </div>
                    <div class="total-value-container">
                        <div id="grandTotal" class="total-value">0</div>
                        <div id="grandTotalCurrency" class="total-currency">جنيه</div>
                    </div>
                </div>

                <div style="width: 60px;"></div>
            </div>

            <div class="calculator-header">
                <div class="header-right-group">
                    <!-- الزر الأول العلوي (الخاص بإنشاء أو التنقل للسطر التالي) -->
                    <button type="button" id="topActionBtn" class="top-action-btn" title="الانتقال للسطر التالي أو إنشاء سطر جديد" onclick="handleTopActionBtnClick()"></button>
                    <!-- الزر العلوي الجديد الثاني (لنقل التركيز لعمود الملاحظات) -->
                    <button type="button" id="topNotesFocusBtn" class="top-notes-focus-btn" title="التركيز على عمود الملاحظات" onclick="handleTopNotesFocusClick()">📝</button>
                    <span class="designer-credit">designed by Sami Arouj</span>
                    <div class="export-dropdown" id="exportDropdown">
                        <button class="export-btn" onclick="toggleExportMenu(event)">
                            تصدير <span>▼</span>
                        </button>
                        <div class="dropdown-content">
                            <button onclick="exportToExcel()">إكسيل (Excel)</button>
                            <button onclick="exportToWord()">وورد (Word)</button>
                            <button onclick="exportToPDF()">بي دي إف (PDF)</button>
                            <button onclick="exportToImage()">صورة (Image)</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="screenContainer" class="calculator-screen"></div>

        <div class="keyboard-hint">
            <span>الأسهم</span> للتحرك بين الأسطر والحقول | <span>Home</span> للحساب بالقوة | <span>Page Up</span> لتجاهل ما قبل المؤشر | <span>Enter</span> للسطر التالي أو جديد
        </div>
    </div>

    <script>
        const screenContainer = document.getElementById('screenContainer');
        const grandTotalEl = document.getElementById('grandTotal');
        const grandTotalCurrencyEl = document.getElementById('grandTotalCurrency');
        const showCurrencyCheckbox = document.getElementById('showCurrencyCheckbox');
        const showPositiveCheckbox = document.getElementById('showPositiveCheckbox');
        const showNegativeCheckbox = document.getElementById('showNegativeCheckbox');
        const positiveTotalValEl = document.getElementById('positiveTotalVal');
        const negativeTotalValEl = document.getElementById('negativeTotalVal');
        const calculatorContainer = document.getElementById('calculatorContainer');
        const topActionBtn = document.getElementById('topActionBtn');
        const topNotesFocusBtn = document.getElementById('topNotesFocusBtn');

        function isMobileDevice() {
            const hasTouchScreen = (('maxTouchPoints' in navigator && navigator.maxTouchPoints > 0) || ('msMaxTouchPoints' in navigator && navigator.msMaxTouchPoints > 0));
            const isUserAgentMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const isSmallScreen = window.innerWidth <= 1024;
            return isUserAgentMobile || (hasTouchScreen && isSmallScreen);
        }

        const isMobile = isMobileDevice();

        if (isMobile) {
            topActionBtn.style.display = 'flex';
            topNotesFocusBtn.style.display = 'flex';
        }

        let rows = [
            { 
                textExpression: '', 
                expression: '', 
                result: 0, 
                forceCalc: false, 
                ignoreBeforeIndex: 0, 
                isCalcVisible: true, 
                isCalcPadVisible: isMobile, 
                isTextPadVisible: false,
                forceKeyboardText: false,
                forceKeyboardCalc: false
            }
        ];
        let activeRowIndex = 0;
        let activeFieldIndex = 'calc';

        // وظيفة الزر العلوي الأول (التحرك خطوة بخطوة وإنشاء سطر جديد عند الأخير)
        function handleTopActionBtnClick() {
            if (activeRowIndex < rows.length - 1) {
                // إلغاء تفعيل الآلة المصغرة للسطر القديم وتفعيلها للجديد
                rows[activeRowIndex].isCalcPadVisible = false;
                activeRowIndex++;
                activeFieldIndex = 'calc';
                rows[activeRowIndex].isCalcPadVisible = isMobile;
                renderCalculator('calc');
                scrollToActiveRow();
            } else {
                evaluateRow(activeRowIndex);
                rows[activeRowIndex].isCalcPadVisible = false; // إغلاق الآلة للسطر السابق
                rows.push({ 
                    textExpression: '', 
                    expression: '', 
                    result: 0, 
                    forceCalc: false, 
                    ignoreBeforeIndex: 0, 
                    isCalcVisible: true, 
                    isCalcPadVisible: isMobile, 
                    isTextPadVisible: false,
                    forceKeyboardText: false,
                    forceKeyboardCalc: false
                });
                activeRowIndex = rows.length - 1;
                activeFieldIndex = 'calc';
                renderCalculator('calc');
                screenContainer.scrollTop = screenContainer.scrollHeight;
            }
        }

        // وظيفة الزر العلوي الثاني الجديد (نقل التركيز فوراً إلى عمود الملاحظات)
        function handleTopNotesFocusClick() {
            activeFieldIndex = 'text';
            renderCalculator('text');
        }

        function goToFirstRow() {
            if (rows.length > 0) {
                activeRowIndex = 0;
                renderCalculator(activeFieldIndex);
                scrollToActiveRow();
            }
        }

        function goToLastRow() {
            if (rows.length > 0) {
                activeRowIndex = rows.length - 1;
                renderCalculator(activeFieldIndex);
                scrollToActiveRow();
            }
        }

        function clearCurrentField() {
            if (rows[activeRowIndex]) {
                if (activeFieldIndex === 'text') {
                    rows[activeRowIndex].textExpression = '';
                } else {
                    rows[activeRowIndex].expression = '';
                    rows[activeRowIndex].result = 0;
                    rows[activeRowIndex].forceCalc = false;
                    rows[activeRowIndex].ignoreBeforeIndex = 0;
                }
                renderCalculator(activeFieldIndex);
            }
        }

        function scrollToActiveRow() {
            const activeRowEl = screenContainer.children[activeRowIndex];
            if (activeRowEl) {
                activeRowEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function toggleOptionsMenu(e) {
            e.stopPropagation();
            const dropdown = document.getElementById('optionsDropdownContent');
            const exportDropdown = document.querySelector('#exportDropdown .dropdown-content');
            if (exportDropdown) exportDropdown.parentElement.classList.remove('active');
            dropdown.classList.toggle('active');
        }

        function toggleExportMenu(e) {
            e.stopPropagation();
            const dropdown = document.getElementById('exportDropdown');
            const optionsDropdown = document.getElementById('optionsDropdownContent');
            if (optionsDropdown) optionsDropdown.classList.remove('active');
            dropdown.classList.toggle('active');
        }

        window.addEventListener('click', (e) => {
            const optionsDropdown = document.getElementById('optionsDropdownContent');
            const exportDropdown = document.getElementById('exportDropdown');
            
            if (optionsDropdown && !optionsDropdown.contains(e.target) && !e.target.closest('.options-btn')) {
                optionsDropdown.classList.remove('active');
            }
            if (exportDropdown && !exportDropdown.contains(e.target)) {
                exportDropdown.classList.remove('active');
            }
        });

        function insertValueForField(index, field, val) {
            activeRowIndex = index;
            activeFieldIndex = field;
            if (field === 'text') {
                rows[index].textExpression += val;
                renderCalculator('text');
            } else {
                rows[index].expression += val;
                rows[index].forceCalc = false;
                evaluateRow(index);
                renderCalculator('calc');
            }
        }

        function handleBackspaceForField(index, field) {
            activeRowIndex = index;
            activeFieldIndex = field;
            if (field === 'text') {
                let text = rows[index].textExpression;
                if (text.length > 0) {
                    rows[index].textExpression = text.substring(0, text.length - 1);
                    renderCalculator('text');
                }
            } else {
                let expr = rows[index].expression;
                if (expr.length > 0) {
                    rows[index].expression = expr.substring(0, expr.length - 1);
                    rows[index].forceCalc = false;
                    evaluateRow(index);
                    renderCalculator('calc');
                }
            }
        }

        function openKeyboardForField(index, field) {
            activeRowIndex = index;
            activeFieldIndex = field;
            if (field === 'text') {
                rows[index].forceKeyboardText = true;
            } else {
                rows[index].forceKeyboardCalc = true;
            }
            renderCalculator(field);
        }

        // عند الضغط على إنتر في الآلة المصغرة: إلغاء تفعيل السطر السابق وتفعيل الجديد
        function addNewRowFromPad(index, field) {
            evaluateRow(index);
            rows[index].isCalcPadVisible = false;
            rows[index].isTextPadVisible = false;

            if (index < rows.length - 1) {
                activeRowIndex = index + 1;
                activeFieldIndex = field;
                if (field === 'calc') rows[activeRowIndex].isCalcPadVisible = isMobile;
                if (field === 'text') rows[activeRowIndex].isTextPadVisible = isMobile;
                renderCalculator(field);
                scrollToActiveRow();
            } else {
                rows.push({ 
                    textExpression: '', 
                    expression: '', 
                    result: 0, 
                    forceCalc: false, 
                    ignoreBeforeIndex: 0, 
                    isCalcVisible: true, 
                    isCalcPadVisible: (field === 'calc' && isMobile), 
                    isTextPadVisible: (field === 'text' && isMobile),
                    forceKeyboardText: false,
                    forceKeyboardCalc: false
                });
                activeRowIndex = rows.length - 1;
                activeFieldIndex = field;
                renderCalculator(field);
                screenContainer.scrollTop = screenContainer.scrollHeight;
            }
        }

        function formatDisplayValue(val) {
            if (typeof val === 'number') {
                if (val < 0) {
                    return { text: `(${Math.abs(val)})`, isNegative: true };
                }
                return { text: `${val}`, isNegative: false };
            }
            return { text: val, isNegative: false };
        }

        function createMiniKeypad(index, field) {
            const keypadDiv = document.createElement('div');
            keypadDiv.className = 'row-mini-keypad';
            
            const headerDiv = document.createElement('div');
            headerDiv.className = 'keypad-header';
            
            const titleSpan = document.createElement('span');
            titleSpan.className = 'keypad-drag-title';
            titleSpan.innerHTML = '☰ اسحب من أي مكان بالآلة';
            headerDiv.appendChild(titleSpan);

            const closeBtn = document.createElement('button');
            closeBtn.type = 'button';
            closeBtn.className = 'close-keypad-btn';
            closeBtn.innerText = 'إخفاء ✕';
            closeBtn.title = 'إخفاء الآلة الحاسبة';
            closeBtn.addEventListener('click', () => {
                if (field === 'text') {
                    rows[index].isTextPadVisible = false;
                } else {
                    rows[index].isCalcPadVisible = false;
                }
                renderCalculator(field);
            });
            headerDiv.appendChild(closeBtn);
            keypadDiv.appendChild(headerDiv);

            let isDraggingKeypad = false;
            let startX = 0, startY = 0;
            let currentX = 0, currentY = 0;

            keypadDiv.addEventListener('mousedown', startKeypadDrag);
            window.addEventListener('mousemove', onKeypadDrag);
            window.addEventListener('mouseup', stopKeypadDrag);

            keypadDiv.addEventListener('touchstart', startKeypadDrag, { passive: true });
            window.addEventListener('touchmove', onKeypadDrag, { passive: true });
            window.addEventListener('touchend', stopKeypadDrag);

            function startKeypadDrag(e) {
                if (e.target.closest('button')) return;
                isDraggingKeypad = true;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                startX = clientX - currentX;
                startY = clientY - currentY;
            }

            function onKeypadDrag(e) {
                if (!isDraggingKeypad) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                currentX = clientX - startX;
                currentY = clientY - startY;
                keypadDiv.style.transform = `translate(${currentX}px, ${currentY}px)`;
            }

            function stopKeypadDrag() {
                isDraggingKeypad = false;
            }

            const keys = [
                '⬆ Up', '⬇ Down', '🗑 Del', '⌫',
                '7', '8', '9', '/',
                '4', '5', '6', '*',
                '1', '2', '3', '-',
                '0', '.', '%', '+',
                '⌨ Keyboard', 'Enter'
            ];

            keys.forEach(k => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'mini-key-btn';
                if (['+', '-', '*', '/', '%'].includes(k)) btn.classList.add('op');
                if (k === '⌫') btn.classList.add('backspace');
                if (k === '⌨ Keyboard') {
                    btn.classList.add('kbd-key');
                    btn.style.gridColumn = 'span 1';
                }
                if (k === '⬆ Up' || k === '⬇ Down') btn.classList.add('nav-key');
                if (k === '🗑 Del') btn.classList.add('clear-key');
                if (k === 'Enter') {
                    btn.classList.add('enter-key');
                    btn.style.gridColumn = 'span 3';
                }

                btn.innerText = k === 'Enter' ? 'Enter ↵' : k;
                
                btn.addEventListener('click', () => {
                    if (k === '⌫') {
                        handleBackspaceForField(index, field);
                    } else if (k === '⌨ Keyboard') {
                        openKeyboardForField(index, field);
                    } else if (k === '⬆ Up') {
                        goToFirstRow();
                    } else if (k === '⬇ Down') {
                        goToLastRow();
                    } else if (k === '🗑 Del') {
                        clearCurrentField();
                    } else if (k === 'Enter') {
                        addNewRowFromPad(index, field);
                    } else {
                        insertValueForField(index, field, k);
                    }
                });
                keypadDiv.appendChild(btn);
            });

            return keypadDiv;
        }

        function renderCalculator(focusTarget = null) {
            screenContainer.innerHTML = '';
            let totalSum = 0;
            let positiveSum = 0;
            let negativeSum = 0;
            let targetInputToFocus = null;
            const showCurrency = showCurrencyCheckbox.checked;

            rows.forEach((row, index) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = `calc-row ${index === activeRowIndex ? 'active' : ''} ${!row.isCalcVisible ? 'hidden-calc' : ''}`;

                const rowMain = document.createElement('div');
                rowMain.className = 'calc-row-main';

                const inputsGroup = document.createElement('div');
                inputsGroup.className = 'inputs-group';

                // 1. عمود الملاحظات (النص) في اليمين
                const textWrapper = document.createElement('div');
                textWrapper.className = 'text-input-wrapper';

                const textToggleCheckbox = document.createElement('input');
                textToggleCheckbox.type = 'checkbox';
                textToggleCheckbox.className = 'row-toggle-checkbox';
                textToggleCheckbox.checked = row.forceKeyboardText;
                textToggleCheckbox.title = 'فتح كيبورد الموبايل للسطر الحالي';
                textToggleCheckbox.addEventListener('change', (e) => {
                    activeRowIndex = index;
                    activeFieldIndex = 'text';
                    rows[index].forceKeyboardText = e.target.checked;
                    renderCalculator('text');
                });

                const textPadCheckbox = document.createElement('input');
                textPadCheckbox.type = 'checkbox';
                textPadCheckbox.className = 'row-pad-checkbox';
                textPadCheckbox.checked = row.isTextPadVisible;
                textPadCheckbox.title = 'إظهار لوحة تحكم مصغرة لعمود الملاحظات';
                textPadCheckbox.addEventListener('change', (e) => {
                    activeRowIndex = index;
                    // إلغاء تفعيل الآلة للأسطر الأخرى
                    rows.forEach(r => r.isTextPadVisible = false);
                    rows[index].isTextPadVisible = e.target.checked;
                    renderCalculator('text');
                });

                const mobileArrowBtn = document.createElement('button');
                mobileArrowBtn.type = 'button';
                mobileArrowBtn.className = 'row-mobile-arrow-btn';
                mobileArrowBtn.innerHTML = '🔽';
                mobileArrowBtn.title = 'التنقل لأسفل أو إضافة سطر جديد';
                
                if (isMobile) {
                    mobileArrowBtn.style.display = 'flex';
                }

                mobileArrowBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (index < rows.length - 1) {
                        activeRowIndex = index + 1;
                        activeFieldIndex = 'text';
                        renderCalculator('text');
                        scrollToActiveRow();
                    } else {
                        evaluateRow(index);
                        rows[index].isTextPadVisible = false;
                        rows.push({ 
                            textExpression: '', 
                            expression: '', 
                            result: 0, 
                            forceCalc: false, 
                            ignoreBeforeIndex: 0, 
                            isCalcVisible: true, 
                            isCalcPadVisible: false, 
                            isTextPadVisible: false,
                            forceKeyboardText: true,
                            forceKeyboardCalc: false
                        });
                        activeRowIndex = rows.length - 1;
                        activeFieldIndex = 'text';
                        renderCalculator('text');
                        screenContainer.scrollTop = screenContainer.scrollHeight;
                    }
                });

                const textInput = document.createElement('textarea');
                textInput.className = 'text-input';
                textInput.value = row.textExpression;
                textInput.rows = 1;

                if (isMobile && !row.forceKeyboardText) {
                    textInput.setAttribute('readonly', 'true');
                    textInput.setAttribute('inputmode', 'none');
                } else {
                    textInput.removeAttribute('readonly');
                    textInput.removeAttribute('inputmode');
                }
                
                textInput.addEventListener('input', (e) => {
                    rows[index].textExpression = e.target.value;
                    e.target.style.height = 'auto';
                    e.target.style.height = (e.target.scrollHeight) + 'px';
                });

                textInput.addEventListener('focus', () => {
                    if (activeRowIndex !== index) {
                        activeRowIndex = index;
                        activeFieldIndex = 'text';
                        renderCalculator('text');
                    } else {
                        activeFieldIndex = 'text';
                        updateActiveRowClasses();
                    }
                });

                textInput.addEventListener('keydown', (e) => {
                    handleArrowNavigation(e, index, 'text');
                });

                textWrapper.appendChild(textToggleCheckbox);
                textWrapper.appendChild(textPadCheckbox);
                textWrapper.appendChild(mobileArrowBtn);
                textWrapper.appendChild(textInput);

                // 2. عمود النتيجة في الوسط
                const outputContainer = document.createElement('div');
                outputContainer.className = 'calc-output-container';

                const outputDiv = document.createElement('div');
                outputDiv.className = 'calc-output';

                const currencySpan = document.createElement('span');
                currencySpan.className = 'row-currency';
                currencySpan.innerText = showCurrency ? 'جنيه' : '';

                if (row.result !== '' && row.result !== 0) {
                    const formatted = formatDisplayValue(row.result);
                    outputDiv.innerText = formatted.text;
                    if (formatted.isNegative) {
                        outputDiv.classList.add('negative');
                    } else {
                        outputDiv.classList.remove('negative');
                    }
                } else {
                    outputDiv.innerText = '';
                    currencySpan.innerText = '';
                }

                outputContainer.appendChild(outputDiv);
                outputContainer.appendChild(currencySpan);

                // 3. عمود العملية الحسابية (المعادلة) في الشمال (اليسار)
                const calcWrapper = document.createElement('div');
                calcWrapper.className = 'calc-input-wrapper';

                const rowToggleCheckbox = document.createElement('input');
                rowToggleCheckbox.type = 'checkbox';
                rowToggleCheckbox.className = 'row-toggle-checkbox';
                rowToggleCheckbox.checked = row.isCalcVisible;
                rowToggleCheckbox.title = 'إظهار/إخفاء العملية الحسابية للسطر';
                rowToggleCheckbox.addEventListener('change', (e) => {
                    activeRowIndex = index;
                    rows[index].isCalcVisible = e.target.checked;
                    evaluateRow(index);
                    renderCalculator(activeFieldIndex);
                });

                const calcPadCheckbox = document.createElement('input');
                calcPadCheckbox.type = 'checkbox';
                calcPadCheckbox.className = 'row-pad-checkbox';
                calcPadCheckbox.checked = row.isCalcPadVisible;
                calcPadCheckbox.title = 'إظهار آلة حاسبة لعمود العملية الحسابية';
                calcPadCheckbox.addEventListener('change', (e) => {
                    activeRowIndex = index;
                    // إلغاء تفعيل الآلة من كل الأسطر السابقة والتركيز على هذا السطر فقط
                    rows.forEach(r => r.isCalcPadVisible = false);
                    rows[index].isCalcPadVisible = e.target.checked;
                    renderCalculator('calc');
                });

                const inputField = document.createElement('input');
                inputField.type = 'text';
                inputField.className = 'calc-input';
                inputField.value = row.expression;

                if (isMobile && !row.forceKeyboardCalc) {
                    inputField.setAttribute('readonly', 'true');
                    inputField.setAttribute('inputmode', 'none');
                } else {
                    inputField.removeAttribute('readonly');
                    inputField.removeAttribute('inputmode');
                }
                
                inputField.addEventListener('input', (e) => {
                    rows[index].expression = e.target.value;
                    rows[index].forceCalc = false;
                    if (e.target.value.length < rows[index].ignoreBeforeIndex) {
                        rows[index].ignoreBeforeIndex = 0;
                    }
                    evaluateRow(index);
                });

                inputField.addEventListener('focus', () => {
                    if (activeRowIndex !== index) {
                        activeRowIndex = index;
                        activeFieldIndex = 'calc';
                        renderCalculator('calc');
                    } else {
                        activeFieldIndex = 'calc';
                        updateActiveRowClasses();
                    }
                });

                inputField.addEventListener('keydown', (e) => {
                    if (e.key === 'Home') {
                        e.preventDefault();
                        rows[index].forceCalc = true;
                        rows[index].ignoreBeforeIndex = 0;
                        evaluateRow(index);
                        renderCalculator('calc');
                    }
                    else if (e.key === 'PageUp') {
                        e.preventDefault();
                        rows[index].ignoreBeforeIndex = inputField.selectionStart;
                        evaluateRow(index);
                        renderCalculator('calc');
                    }
                    else if (e.key === 'Delete') {
                        e.preventDefault();
                        clearCurrentField();
                    }
                    else {
                        handleArrowNavigation(e, index, 'calc');
                    }
                });

                calcWrapper.appendChild(rowToggleCheckbox);
                calcWrapper.appendChild(calcPadCheckbox);
                calcWrapper.appendChild(inputField);

                inputsGroup.appendChild(textWrapper);
                inputsGroup.appendChild(outputContainer);
                inputsGroup.appendChild(calcWrapper);

                if (index === activeRowIndex) {
                    if (focusTarget === 'text') {
                        targetInputToFocus = textInput;
                    } else {
                        targetInputToFocus = inputField;
                    }
                }

                const micBtn = document.createElement('button');
                micBtn.className = 'mic-btn';
                micBtn.innerHTML = '🎤';
                micBtn.title = 'تحدث للإدخال في الحقل النشط';
                micBtn.type = 'button';
                micBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    startSpeechRecognition(index, micBtn);
                });

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-row-btn';
                deleteBtn.innerHTML = '✕';
                deleteBtn.title = 'حذف السطر';
                deleteBtn.type = 'button';
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteRow(index);
                });

                rowMain.appendChild(inputsGroup);
                rowMain.appendChild(micBtn);
                rowMain.appendChild(deleteBtn);
                rowDiv.appendChild(rowMain);

                if (index === activeRowIndex && (row.isTextPadVisible || row.isCalcPadVisible)) {
                    const keypadContainer = document.createElement('div');
                    keypadContainer.className = 'row-keypad-container';

                    if (row.isTextPadVisible) {
                        keypadContainer.appendChild(createMiniKeypad(index, 'text'));
                    }
                    if (row.isCalcPadVisible) {
                        keypadContainer.appendChild(createMiniKeypad(index, 'calc'));
                    }

                    rowDiv.appendChild(keypadContainer);
                }

                screenContainer.appendChild(rowDiv);

                setTimeout(() => {
                    textInput.style.height = 'auto';
                    textInput.style.height = (textInput.scrollHeight) + 'px';
                }, 0);

                if (typeof row.result === 'number' && !isNaN(row.result)) {
                    totalSum += row.result;
                    if (row.result > 0) {
                        positiveSum += row.result;
                    } else if (row.result < 0) {
                        negativeSum += row.result;
                    }
                }
            });

            const formattedTotal = formatDisplayValue(Number.isInteger(totalSum) ? totalSum : parseFloat(totalSum.toFixed(6)));
            grandTotalEl.innerText = formattedTotal.text;
            grandTotalCurrencyEl.innerText = showCurrency ? 'جنيه' : '';
            
            if (formattedTotal.isNegative) {
                grandTotalEl.classList.add('negative');
            } else {
                grandTotalEl.classList.remove('negative');
            }

            const posFormatted = formatDisplayValue(Number.isInteger(positiveSum) ? positiveSum : parseFloat(positiveSum.toFixed(6)));
            const negFormatted = formatDisplayValue(Number.isInteger(negativeSum) ? negativeSum : parseFloat(negativeSum.toFixed(6)));

            positiveTotalValEl.innerText = showPositiveCheckbox.checked ? posFormatted.text : '';
            negativeTotalValEl.innerText = showNegativeCheckbox.checked ? negFormatted.text : '';

            if (targetInputToFocus) {
                if (activeFieldIndex === 'calc' && !rows[activeRowIndex].isCalcVisible) {
                    const activeText = screenContainer.querySelector('.calc-row.active .text-input');
                    if (activeText) setTimeout(() => activeText.focus(), 0);
                } else {
                    setTimeout(() => targetInputToFocus.focus(), 0);
                }
            }
        }

        function handleArrowNavigation(e, index, currentField) {
            const key = e.key;

            if (key === 'ArrowDown') {
                if (index < rows.length - 1) {
                    e.preventDefault();
                    rows[index].isCalcPadVisible = false;
                    rows[index].isTextPadVisible = false;
                    activeRowIndex = index + 1;
                    activeFieldIndex = currentField;
                    if (currentField === 'calc') rows[activeRowIndex].isCalcPadVisible = isMobile;
                    renderCalculator(currentField);
                    scrollToActiveRow();
                }
            } 
            else if (key === 'ArrowUp') {
                if (index > 0) {
                    e.preventDefault();
                    rows[index].isCalcPadVisible = false;
                    rows[index].isTextPadVisible = false;
                    activeRowIndex = index - 1;
                    activeFieldIndex = currentField;
                    if (currentField === 'calc') rows[activeRowIndex].isCalcPadVisible = isMobile;
                    renderCalculator(currentField);
                    scrollToActiveRow();
                }
            } 
            else if (key === 'ArrowRight') {
                if (currentField === 'calc') {
                    e.preventDefault();
                    activeFieldIndex = 'text';
                    renderCalculator('text');
                }
            } 
            else if (key === 'ArrowLeft') {
                if (currentField === 'text') {
                    e.preventDefault();
                    activeFieldIndex = 'calc';
                    renderCalculator('calc');
                }
            }
        }

        function startSpeechRecognition(index, micBtn) {
            if (activeFieldIndex === 'calc' && !rows[index].isCalcVisible) return;
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('متصفحك لا يدعم خاصية التعرف على الصوت.');
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            micBtn.classList.add('listening');
            micBtn.innerHTML = '🔴';

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                
                if (activeFieldIndex === 'text') {
                    rows[index].textExpression = rows[index].textExpression ? rows[index].textExpression + ' ' + speechToText : speechToText;
                    renderCalculator('text');
                } else {
                    rows[index].expression = rows[index].expression ? rows[index].expression + ' ' + speechToText : speechToText;
                    rows[index].forceCalc = false;
                    evaluateRow(index);
                    renderCalculator('calc');
                }
            };

            recognition.onerror = () => {
                micBtn.classList.remove('listening');
                micBtn.innerHTML = '🎤';
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
                micBtn.innerHTML = '🎤';
            };

            recognition.start();
        }

        function updateActiveRowClasses() {
            const rowDivs = screenContainer.children;
            for (let i = 0; i < rowDivs.length; i++) {
                if (i === activeRowIndex) {
                    rowDivs[i].classList.add('active');
                } else {
                    rowDivs[i].classList.remove('active');
                }
            }
        }

        function deleteRow(index) {
            if (rows.length === 1) {
                rows[0].textExpression = '';
                rows[0].expression = '';
                rows[0].result = 0;
                rows[0].forceCalc = false;
                rows[0].ignoreBeforeIndex = 0;
                rows[0].isCalcVisible = true;
                rows[0].isCalcPadVisible = isMobile;
                rows[0].isTextPadVisible = false;
                rows[0].forceKeyboardText = false;
                rows[0].forceKeyboardCalc = false;
            } else {
                rows.splice(index, 1);
                if (activeRowIndex >= rows.length) {
                    activeRowIndex = rows.length - 1;
                }
                rows.forEach(r => r.isCalcPadVisible = false);
                rows[activeRowIndex].isCalcPadVisible = isMobile;
            }
            renderCalculator('calc');
        }

        function evaluateRow(index) {
            let currentRow = rows[index];
            let fullExpr = currentRow.expression.trim();

            if (fullExpr === '') {
                currentRow.result = 0;
                updateGrandTotalOnly();
                return;
            }

            let expr = fullExpr;
            if (currentRow.ignoreBeforeIndex > 0) {
                expr = fullExpr.substring(currentRow.ignoreBeforeIndex).trim();
            }

            if (expr === '') {
                currentRow.result = 0;
                updateGrandTotalOnly();
                return;
            }

            let hasAttachedTextBeforeOrAfter = /(\d+[a-zA-Zأ-ي\u0600-\u06FF])|([a-zA-Zأ-ي\u0600-\u06FF]\d+)/.test(expr);

            if (hasAttachedTextBeforeOrAfter && !currentRow.forceCalc) {
                currentRow.result = 0;
                updateGrandTotalOnly();
                return;
            }

            let percentMatch = expr.match(/^([\d.]+)\s*([\+\-\*\/])\s*([\d.]+)%$/);
            if (percentMatch) {
                let baseNum = parseFloat(percentMatch[1]);
                let operator = percentMatch[2];
                let percentVal = parseFloat(percentMatch[3]);
                let calculatedPercent = baseNum * (percentVal / 100);
                let res = 0;

                if (operator === '+') {
                    res = baseNum + calculatedPercent;
                } else if (operator === '-') {
                    res = baseNum - calculatedPercent;
                } else if (operator === '*') {
                    res = calculatedPercent;
                } else if (operator === '/') {
                    res = calculatedPercent !== 0 ? baseNum / calculatedPercent : 0;
                }

                currentRow.result = Number.isInteger(res) ? res : parseFloat(res.toFixed(6));
                updateGrandTotalOnly();
                return;
            }

            let sanitizedExpr = expr
                .replace(/×/g, '*')
                .replace(/÷/g, '/');

            let validMathPattern = /^[0-9+\-*/.\s()a-zA-Zأ-ي\u0600-\u06FF%]+$/;

            if (validMathPattern.test(sanitizedExpr)) {
                try {
                    let singleNegativeMatch = expr.match(/^-\s*([\d.]+)$/);
                    if (singleNegativeMatch) {
                        let res = -parseFloat(singleNegativeMatch[1]);
                        currentRow.result = Number.isInteger(res) ? res : parseFloat(res.toFixed(6));
                        updateGrandTotalOnly();
                        return;
                    }

                    let evalSafeExpr = sanitizedExpr.replace(/[^0-9+\-*/().]/g, '');
                    let res = Function('"use strict"; return (' + evalSafeExpr + ')')();

                    if (isNaN(res) || !isFinite(res)) {
                        currentRow.result = 0;
                    } else {
                        currentRow.result = Number.isInteger(res) ? res : parseFloat(res.toFixed(6));
                    }
                } catch (e) {
                    currentRow.result = 0;
                }
            } else {
                currentRow.result = 0;
            }
            
            updateGrandTotalOnly();
        }

        function updateGrandTotalOnly() {
            let totalSum = 0;
            let positiveSum = 0;
            let negativeSum = 0;
            const showCurrency = showCurrencyCheckbox.checked;

            rows.forEach((row, index) => {
                const rowDivs = screenContainer.children;
                if (rowDivs[index]) {
                    const outputDiv = rowDivs[index].querySelector('.calc-output');
                    const currencySpan = rowDivs[index].querySelector('.row-currency');

                    if (row.result !== '' && row.result !== 0) {
                        const formatted = formatDisplayValue(row.result);
                        outputDiv.innerText = formatted.text;
                        currencySpan.innerText = showCurrency ? 'جنيه' : '';
                        if (formatted.isNegative) {
                            outputDiv.classList.add('negative');
                        } else {
                            outputDiv.classList.remove('negative');
                        }
                    } else {
                        outputDiv.innerText = '';
                        currencySpan.innerText = '';
                    }
                }
                if (typeof row.result === 'number' && !isNaN(row.result)) {
                    totalSum += row.result;
                    if (row.result > 0) {
                        positiveSum += row.result;
                    } else if (row.result < 0) {
                        negativeSum += row.result;
                    }
                }
            });

            const formattedTotal = formatDisplayValue(Number.isInteger(totalSum) ? totalSum : parseFloat(totalSum.toFixed(6)));
            grandTotalEl.innerText = formattedTotal.text;
            grandTotalCurrencyEl.innerText = showCurrency ? 'جنيه' : '';

            if (formattedTotal.isNegative) {
                grandTotalEl.classList.add('negative');
            } else {
                grandTotalEl.classList.remove('negative');
            }

            const posFormatted = formatDisplayValue(Number.isInteger(positiveSum) ? positiveSum : parseFloat(positiveSum.toFixed(6)));
            const negFormatted = formatDisplayValue(Number.isInteger(negativeSum) ? negativeSum : parseFloat(negativeSum.toFixed(6)));

            positiveTotalValEl.innerText = showPositiveCheckbox.checked ? posFormatted.text : '';
            negativeTotalValEl.innerText = showNegativeCheckbox.checked ? negFormatted.text : '';
        }

        function exportToExcel() {
            const showCurrency = showCurrencyCheckbox.checked;
            let dataToExport = rows.map((r, i) => ({
                "السطر": i + 1,
                "العمود النصي / الملاحظات (اليمين)": r.textExpression,
                "النتيجة (الوسط)": showCurrency ? `${r.result} جنيه` : r.result,
                "العملية الحسابية (اليسار)": r.isCalcVisible ? r.expression : ''
            }));
            
            const worksheet = XLSX.utils.json_to_sheet(dataToExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "النتائج");
            XLSX.writeFile(workbook, "Calculator_Results.xlsx");
        }

        function exportToWord() {
            const showCurrency = showCurrencyCheckbox.checked;
            let htmlContent = `<html dir="rtl"><head><meta charset='utf-8'></head><body>`;
            htmlContent += `<h2>تقرير الآلة الحاسبة متعددة الأسطر</h2>`;
            htmlContent += `<table border="1" style="border-collapse:collapse; width:100%;">`;
            htmlContent += `<tr><th>السطر</th><th>الملاحظات (اليمين)</th><th>النتيجة (الوسط)</th><th>العملية الحسابية (اليسار)</th></tr>`;
            
            rows.forEach((r, i) => {
                let exprText = r.isCalcVisible ? r.expression : '';
                let resText = showCurrency ? `${r.result} جنيه` : r.result;
                htmlContent += `<tr><td>${i+1}</td><td>${r.textExpression}</td><td>${resText}</td><td>${exprText}</td></tr>`;
            });
            
            htmlContent += `</table></body></html>`;

            let blob = new Blob(['\ufeff' + htmlContent], {
                type: 'application/msword'
            });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = 'Calculator_Results.doc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function exportToPDF() {
            const opt = {
                margin:       10,
                filename:     'Calculator_Results.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(calculatorContainer).set(opt).save();
        }

        function exportToImage() {
            const dropdown = document.getElementById('exportDropdown');
            dropdown.classList.remove('active');
            dropdown.style.display = 'none';

            html2canvas(calculatorContainer).then(canvas => {
                let link = document.createElement('a');
                link.download = 'Calculator_Results.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                dropdown.style.display = 'inline-block';
            });
        }

        // معالجة مفتاح Enter العام (من لوحة المفاتيح) مع إغلاق الآلة للسطر السابق وتفعيلها للجديد
        document.addEventListener('keydown', (event) => {
            const key = event.key;

            if (key === 'Enter') {
                event.preventDefault();
                evaluateRow(activeRowIndex);
                rows[activeRowIndex].isCalcPadVisible = false;
                rows[activeRowIndex].isTextPadVisible = false;

                if (activeRowIndex < rows.length - 1) {
                    activeRowIndex++;
                    activeFieldIndex = 'calc';
                    rows[activeRowIndex].isCalcPadVisible = isMobile;
                    renderCalculator('calc');
                    scrollToActiveRow();
                } 
                else {
                    rows.push({ 
                        textExpression: '', 
                        expression: '', 
                        result: 0, 
                        forceCalc: false, 
                        ignoreBeforeIndex: 0, 
                        isCalcVisible: true, 
                        isCalcPadVisible: isMobile, 
                        isTextPadVisible: false,
                        forceKeyboardText: false,
                        forceKeyboardCalc: false
                    });
                    activeRowIndex = rows.length - 1;
                    activeFieldIndex = 'calc';
                    renderCalculator('calc');
                    screenContainer.scrollTop = screenContainer.scrollHeight;
                }
            } 
            else if (key === 'Escape') {
                rows = [{ 
                    textExpression: '', 
                    expression: '', 
                    result: 0, 
                    forceCalc: false, 
                    ignoreBeforeIndex: 0, 
                    isCalcVisible: true, 
                    isCalcPadVisible: isMobile,
                    isTextPadVisible: false,
                    forceKeyboardText: false,
                    forceKeyboardCalc: false
                }];
                activeRowIndex = 0;
                activeFieldIndex = 'calc';
                renderCalculator('calc');
            }
            else if (key === 'Backspace') {
                const activeInput = document.activeElement;
                if (activeInput && (activeInput.classList.contains('calc-input') || activeInput.classList.contains('text-input'))) {
                    if (activeInput.value === '' && activeRowIndex > 0) {
                        event.preventDefault();
                        rows.splice(activeRowIndex, 1);
                        activeRowIndex--;
                        rows.forEach(r => r.isCalcPadVisible = false);
                        rows[activeRowIndex].isCalcPadVisible = isMobile;
                        activeFieldIndex = 'calc';
                        renderCalculator('calc');
                    }
                }
            }
        });

        function escapePreviewHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        }

        function openPrintPreview() {
            const showCurrency = showCurrencyCheckbox.checked;
            const previewRows = rows.map((row, index) => {
                const exprText = row.isCalcVisible ? row.expression : '';
                const resultText = (row.result !== '' && row.result !== 0)
                    ? formatDisplayValue(row.result).text + (showCurrency ? ' جنيه' : '') : '';
                return `<tr><td class="number">${index + 1}</td><td class="cell text-cell">${escapePreviewHtml(row.textExpression)}</td><td class="cell result-cell">${escapePreviewHtml(resultText)}</td><td class="cell expression-cell">${escapePreviewHtml(exprText)}</td></tr>`;
            }).join('');
            const totalText = grandTotalEl.innerText + (showCurrency && grandTotalCurrencyEl.innerText ? ' جنيه' : '');
            const positiveText = showPositiveCheckbox.checked ? positiveTotalValEl.innerText : '';
            const negativeText = showNegativeCheckbox.checked ? negativeTotalValEl.innerText : '';
            const w = window.open('', '_blank', 'width=1100,height=800');
            if (!w) { alert('يرجى السماح بفتح النوافذ المنبثقة لعرض معاينة الطباعة.'); return; }
            w.document.open();
            w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>معاينة الطباعة</title>
<style>
*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;color:#172033;background:#f3f7fc;margin:20px}h2{text-align:center;margin:0 0 16px;color:#174a7e;border-bottom:3px solid #25a6c7;padding:0 0 12px}.summary{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin-bottom:16px}.summary div{flex:1;min-width:180px;padding:12px 14px;border:1px solid #b7d8ed;border-right:5px solid #168aad;border-radius:8px;background:#e7f4fb;color:#174a7e}.summary strong{color:#0b6e99}table{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff;box-shadow:0 2px 8px #17324d18}th,td{border:1px solid #b8c9d8;padding:9px;vertical-align:top;text-align:right}th{background:#176b87;color:#fff;font-weight:bold;border-color:#12566d}.number{width:7%;text-align:center;background:#eaf2f8;font-weight:bold;color:#24577a}.text-cell{width:31%;background:#fffaf0;color:#553b14;font-size:16px}.result-cell{width:25%;direction:ltr;text-align:left;background:#e9f8ef;color:#087443;font-weight:bold;font-size:16px}.expression-cell{width:37%;direction:ltr;text-align:left;background:#f1f7ff;color:#174a7e;font-weight:500;font-size:16px}.cell{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}tbody tr:nth-child(even) td{filter:brightness(.975)}tbody tr:hover td{background-color:#e1f4fb}.actions{margin-bottom:16px;text-align:center}button{padding:10px 22px;font-size:16px;cursor:pointer;border:0;border-radius:6px;background:#176b87;color:#fff;margin:0 4px}button+button{background:#64748b}@page{size:A4 landscape;margin:10mm}@media print{body{margin:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}.actions{display:none!important}tr{break-inside:avoid;page-break-inside:avoid}th,td,.summary div,.number,.text-cell,.result-cell,.expression-cell{print-color-adjust:exact;-webkit-print-color-adjust:exact}h2{color:#174a7e}}
</style></head><body>
<div class="actions"><button onclick="window.print()">طباعة التقرير</button> <button onclick="window.close()">إغلاق المعاينة</button></div>
<h2>تقرير الآلة الحاسبة متعددة الأسطر</h2><div class="summary"><div><strong>الإجمالي:</strong> ${escapePreviewHtml(totalText)}</div>
${positiveText !== '' ? `<div><strong>مجموع الموجب:</strong> ${escapePreviewHtml(positiveText)}</div>` : ''}
${negativeText !== '' ? `<div><strong>مجموع السالب:</strong> ${escapePreviewHtml(negativeText)}</div>` : ''}</div>
<table><thead><tr><th class="number">السطر</th><th>الملاحظات / النص</th><th>النتيجة</th><th>العملية الحسابية</th></tr></thead><tbody>${previewRows}</tbody></table></body></html>`);
            w.document.close(); w.focus();
        }

        document.addEventListener('keydown', (event) => {
            if (event.ctrlKey && !event.altKey && !event.shiftKey &&
                (event.code === 'KeyB' || String(event.key).toLowerCase() === 'b')) {
                event.preventDefault();
                event.stopPropagation();
                openPrintPreview();
            }
        }, true);

        renderCalculator('calc');
    </script>
</body>
</html>
