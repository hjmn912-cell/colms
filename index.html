<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>آلة حاسبة الأسطر المتعددة</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .calculator-container {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            background-color: #111827;
            border-radius: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid #334155;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            touch-action: none;
        }

        .resize-edge {
            position: absolute;
            z-index: 10000;
        }
        .resize-edge.right { top: 0; right: 0; width: 12px; height: 100%; cursor: e-resize; }
        .resize-edge.left { top: 0; left: 0; width: 12px; height: 100%; cursor: w-resize; }
        .resize-edge.bottom { bottom: 0; left: 0; width: 100%; height: 12px; cursor: s-resize; }
        .resize-edge.corner-br { bottom: 0; right: 0; width: 20px; height: 20px; cursor: nwse-resize; }

        .mobile-preview-top-bar {
            display: none;
            background-color: #020617;
            color: #38bdf8;
            padding: 6px 10px;
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 2px solid #38bdf8;
            width: 100%;
            text-align: right;
            white-space: nowrap;
            overflow-x: auto;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            justify-content: space-between;
            align-items: center;
        }

        .mobile-preview-result {
            color: #10b981;
            font-size: 1.1rem;
            font-weight: 700;
            margin-right: 15px;
        }

        .mobile-combo-box {
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 3px 5px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            outline: none;
            margin-left: 6px;
            height: 28px;
            width: 32px;
            text-align: center;
        }

        .desktop-mic-combo {
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 0 4px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            outline: none;
            height: 32px;
            width: 32px;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .desktop-mic-combo:hover {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .sticky-top-section {
            position: relative;
            background-color: #030712;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            flex-shrink: 0;
        }

        .top-controls-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #1f2937;
            gap: 8px;
            position: relative;
            flex-wrap: wrap;
        }

        .left-controls-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .options-dropdown {
            position: relative;
            display: inline-block;
        }

        .options-btn, .refresh-btn {
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .refresh-btn {
            padding: 6px 10px;
            font-size: 1rem;
            height: 32px;
            width: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .options-btn:hover, .refresh-btn:hover {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .options-dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 110%;
            background-color: #1e293b;
            min-width: 170px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.5);
            border-radius: 6px;
            z-index: 2000;
            border: 1px solid #38bdf8;
            padding: 8px 10px;
            flex-direction: column;
            gap: 8px;
        }

        .options-dropdown-content.active {
            display: flex;
        }

        .option-toggle-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            font-size: 0.9rem;
            color: #f8fafc;
            white-space: nowrap;
        }

        .option-toggle-label input {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #38bdf8;
        }

        .totals-summary-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            flex: 1;
        }

        .sub-totals-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 1.1rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .positive-sum {
            color: #10b981;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .negative-sum {
            color: #ef4444;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .calculator-header {
            background-color: #030712;
            padding: 8px 12px;
            border-bottom: 2px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 8px;
            position: relative;
        }

        .total-value-container {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 6px;
            flex: 2;
            white-space: nowrap;
        }

        .total-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #38bdf8;
            white-space: nowrap;
        }

        .total-currency {
            font-size: 1rem;
            color: #38bdf8;
            font-weight: 600;
            white-space: nowrap;
        }

        .total-value.negative {
            color: #ef4444 !important;
        }

        .header-right-group {
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: flex-end;
        }

        .designer-credit {
            font-size: 0.7rem;
            color: #6b7280;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .export-dropdown {
            position: relative;
            display: inline-block;
            text-align: left;
        }

        .export-btn {
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .export-btn:hover {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            left: 0;
            background-color: #1e293b;
            min-width: 220px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.5);
            border-radius: 6px;
            z-index: 2000;
            border: 1px solid #38bdf8;
            overflow: hidden;
        }

        .dropdown-content button {
            color: #f8fafc;
            padding: 8px 12px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            text-align: right;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            border-bottom: 1px solid #334155;
        }

        .dropdown-content button:hover {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .calculator-screen {
            background-color: #0f172a;
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden;
            gap: 8px;
            width: 100%;
        }

        .calc-row {
            display: flex;
            flex-direction: column;
            background-color: #1e293b;
            padding: 8px 6px;
            border-radius: 8px;
            border: 1px solid transparent;
            gap: 8px;
            width: 100%;
        }

        .calc-row.active {
            border-color: #38bdf8;
        }

        .calc-row-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
            width: 100%;
        }

        .inputs-group {
            display: flex;
            gap: 4px;
            flex-grow: 1;
            align-items: center;
            width: 100%;
        }

        .text-input-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 3.5; 
            min-width: 0;
        }

        .calc-input-wrapper {
            display: flex;
            align-items: center;
            gap: 2px;
            flex: 1.5; 
            min-width: 0;
        }

        .mic-wrapper {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .text-input, .calc-input {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid #334155;
            border-radius: 6px;
            padding: 6px 6px;
            color: #38bdf8;
            font-size: 1.3rem;
            font-weight: bold;
            outline: none;
            font-family: inherit;
            width: 100%;
        }

        .text-input {
            flex: 1;
            resize: none;
            overflow-y: hidden;
            min-height: 38px;
        }

        .calc-input {
            width: 100%;
            height: 38px;
            direction: ltr;
            text-align: right;
            font-size: 1.4rem;
        }

        .text-border-active, .calc-border-active {
            border-color: #38bdf8 !important;
            background: rgba(56, 189, 248, 0.1) !important;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4) !important;
        }

        .calc-output-container {
            display: flex;
            align-items: baseline;
            gap: 3px;
            min-width: 75px;
            text-align: left;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .calc-output {
            font-size: 1.2rem;
            font-weight: 700;
            color: #10b981;
        }

        .row-currency {
            font-size: 0.9rem;
            color: #38bdf8;
            font-weight: 600;
        }

        .mic-btn {
            background: transparent;
            border: none;
            color: #6b7280;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 2px;
        }

        .keyboard-hint {
            padding: 6px 10px;
            text-align: center;
            font-size: 0.75rem;
            color: #6b7280;
            background-color: #111827;
            border-top: 1px solid #1f2937;
            width: 100%;
            flex-shrink: 0;
        }

        .keyboard-hint span {
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="calculator-container" id="calculatorContainer">
        <div class="resize-edge right" id="edgeRight"></div>
        <div class="resize-edge left" id="edgeLeft"></div>
        <div class="resize-edge bottom" id="edgeBottom"></div>
        <div class="resize-edge corner-br" id="edgeCornerBR"></div>

        <div class="sticky-top-section" id="stickyTopSection">
            <div class="top-controls-wrapper">
                <div class="left-controls-group">
                    <div class="options-dropdown" id="optionsDropdown">
                        <button class="options-btn" type="button" onclick="toggleOptionsMenu(event)">
                            الخيارات <span>▼</span>
                        </button>
                        <div class="options-dropdown-content" id="optionsDropdownContent">
                            <label class="option-toggle-label">
                                <input type="checkbox" id="showCurrencyCheckbox" checked onchange="renderCalculator()">
                                إظهار كلمة جنيه
                            </label>
                        </div>
                    </div>
                    <button class="refresh-btn" id="refreshBtnEl" type="button" onclick="location.reload()">🔄</button>
                </div>

                <div class="totals-summary-bar">
                    <div class="sub-totals-row">
                        <div class="summary-item">
                            <input type="checkbox" id="showPositiveCheckbox" onchange="renderCalculator()">
                            <span id="positiveTotalVal" class="positive-sum"></span>
                        </div>
                        <div class="summary-item">
                            <input type="checkbox" id="showNegativeCheckbox" onchange="renderCalculator()">
                            <span id="negativeTotalVal" class="negative-sum"></span>
                        </div>
                    </div>

                    <div class="total-value-container">
                        <div id="grandTotal" class="total-value">0</div>
                        <div id="grandTotalCurrency" class="total-currency">جنيه</div>
                    </div>
                </div>

                <div class="export-dropdown" id="exportDropdown">
                    <button class="export-btn" title="تصدير ومشاركة" onclick="toggleExportMenu(event)">📊</button>
                    <div class="dropdown-content">
                        <button onclick="exportToExcel()">📊 إكسيل (Excel)</button>
                        <button onclick="exportToWord()">📝 وورد (Word)</button>
                        <button onclick="exportToPDF()">📄 بي دي إف (PDF)</button>
                        <button onclick="exportToTXT()">📄 تصدير ملف نصي (TXT)</button>
                        <button onclick="exportToImage()">🖼️ تنزيل صورة</button>
                    </div>
                </div>
            </div>

            <div class="calculator-header">
                <div class="header-right-group">
                    <span class="designer-credit">designed by Sami Arouj[cite: 1]</span>
                    <select id="desktopMicCombo" class="desktop-mic-combo" onchange="handleDesktopMicComboChange(this)">
                        <option value="" selected>🎤</option>
                        <option value="show">إظهار المايكات</option>
                        <option value="hide">إخفاء المايكات</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="screenContainer" class="calculator-screen"></div>

        <div class="keyboard-hint">
            <span>الأسهم</span> للتحرك بين الأسطر والحقول | <span>Enter</span> للسطر التالي
        </div>
    </div>

    <script>
        const screenContainer = document.getElementById('screenContainer');
        const showCurrencyCheckbox = document.getElementById('showCurrencyCheckbox');
        const showPositiveCheckbox = document.getElementById('showPositiveCheckbox');
        const showNegativeCheckbox = document.getElementById('showNegativeCheckbox');
        const positiveTotalValEl = document.getElementById('positiveTotalVal');
        const negativeTotalValEl = document.getElementById('negativeTotalVal');
        const grandTotalEl = document.getElementById('grandTotal');
        const grandTotalCurrencyEl = document.getElementById('grandTotalCurrency');
        const desktopMicCombo = document.getElementById('desktopMicCombo');

        let globalHideMics = false;

        function detectMobileEnvironment() {
            const ua = navigator.userAgent;
            const width = window.innerWidth;
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) || width <= 1024 ? 'mobile' : 'desktop';
        }

        const env = detectMobileEnvironment();
        const isMobileAny = env !== 'desktop';

        let rows = [
            { textExpression: '', expression: '', result: 0, forceCalc: false, ignoreBeforeIndex: 0, isCalcVisible: true, isTextVisible: true, isMicVisible: true, isCalcPadVisible: false, isTextPadVisible: false }
        ];
        let activeRowIndex = 0;
        let activeFieldIndex = 'calc'; // الافتراضي على حقل العمليات الحسابية

        function toggleOptionsMenu(e) {
            e.stopPropagation();
            document.getElementById('optionsDropdownContent').classList.toggle('active');
        }

        function toggleExportMenu(e) {
            e.stopPropagation();
            document.getElementById('exportDropdown').classList.toggle('active');
        }

        function handleDesktopMicComboChange(selectEl) {
            globalHideMics = selectEl.value === 'hide';
            selectEl.selectedIndex = 0;
            renderCalculator();
        }

        function renderCalculator(focusTarget = 'calc') {
            screenContainer.innerHTML = '';
            let totalSum = 0, positiveSum = 0, negativeSum = 0;
            const showCurrency = showCurrencyCheckbox.checked;

            rows.forEach((row, index) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = `calc-row ${index === activeRowIndex ? 'active' : ''}`;

                const rowMain = document.createElement('div');
                rowMain.className = 'calc-row-main';

                const inputsGroup = document.createElement('div');
                inputsGroup.className = 'inputs-group';

                // حقل الملاحظات (النص)
                const textWrapper = document.createElement('div');
                textWrapper.className = 'text-input-wrapper';
                const textInput = document.createElement('textarea');
                textInput.className = 'text-input';
                textInput.value = row.textExpression;
                textInput.rows = 1;

                if (!isMobileAny) {
                    textInput.removeAttribute('readonly');
                }

                textInput.addEventListener('input', (e) => {
                    rows[index].textExpression = e.target.value;
                });
                textInput.addEventListener('focus', () => {
                    activeRowIndex = index;
                    activeFieldIndex = 'text';
                    updateActiveRowClasses();
                });
                textWrapper.appendChild(textInput);

                // الناتج
                const outputContainer = document.createElement('div');
                outputContainer.className = 'calc-output-container';
                const outputDiv = document.createElement('div');
                outputDiv.className = 'calc-output';
                const currencySpan = document.createElement('span');
                currencySpan.className = 'row-currency';
                currencySpan.innerText = showCurrency ? 'جنيه' : '';

                if (row.result !== 0) {
                    outputDiv.innerText = row.result < 0 ? `(${Math.abs(row.result)})` : row.result;
                    if (row.result < 0) outputDiv.classList.add('negative');
                }
                outputContainer.appendChild(outputDiv);
                outputContainer.appendChild(currencySpan);

                // حقل العمليات الحسابية
                const calcWrapper = document.createElement('div');
                calcWrapper.className = 'calc-input-wrapper';
                const inputField = document.createElement('input');
                inputField.type = 'text';
                inputField.className = 'calc-input';
                inputField.value = row.expression.replace(/\*/g, 'x');

                if (!isMobileAny) {
                    inputField.removeAttribute('readonly');
                }

                if (index === activeRowIndex && activeFieldIndex === 'calc') {
                    inputField.classList.add('calc-border-active');
                }

                inputField.addEventListener('input', (e) => {
                    let rawVal = e.target.value.replace(/x|X|×/g, '*');
                    e.target.value = rawVal.replace(/\*/g, 'x');
                    rows[index].expression = rawVal;
                    evaluateRow(index);
                });

                inputField.addEventListener('focus', () => {
                    activeRowIndex = index;
                    activeFieldIndex = 'calc';
                    updateActiveRowClasses();
                });

                inputField.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (index === rows.length - 1) {
                            rows.push({ textExpression: '', expression: '', result: 0, forceCalc: false, ignoreBeforeIndex: 0, isCalcVisible: true, isTextVisible: true, isMicVisible: true, isCalcPadVisible: false, isTextPadVisible: false });
                        }
                        activeRowIndex = index + 1;
                        activeFieldIndex = 'calc';
                        renderCalculator('calc');
                    }
                });

                calcWrapper.appendChild(inputField);

                inputsGroup.appendChild(textWrapper);
                inputsGroup.appendChild(outputContainer);
                inputsGroup.appendChild(calcWrapper);
                rowMain.appendChild(inputsGroup);
                rowDiv.appendChild(rowMain);
                screenContainer.appendChild(rowDiv);

                totalSum += row.result;
                if (row.result > 0) positiveSum += row.result;
                if (row.result < 0) negativeSum += row.result;
            });

            grandTotalEl.innerText = totalSum;
            grandTotalCurrencyEl.innerText = showCurrency ? 'جنيه' : '';
            positiveTotalValEl.innerText = showPositiveCheckbox.checked ? positiveSum : '';
            negativeTotalValEl.innerText = showNegativeCheckbox.checked ? negativeSum : '';

            // التركيز التلقائي الافتراضي حصرياً على حقل العمليات الحسابية
            setTimeout(() => {
                const targetEl = screenContainer.querySelector(`.calc-row.active .${focusTarget === 'text' ? 'text-input' : 'calc-input'}`);
                if (targetEl) targetEl.focus();
            }, 50);
        }

        function updateActiveRowClasses() {
            document.querySelectorAll('.calc-row').forEach((rowDiv, i) => {
                const textInput = rowDiv.querySelector('.text-input');
                const calcInput = rowDiv.querySelector('.calc-input');
                if (i === activeRowIndex) {
                    rowDiv.classList.add('active');
                    if (activeFieldIndex === 'text') textInput.classList.add('text-border-active');
                    else calcInput.classList.add('calc-border-active');
                } else {
                    rowDiv.classList.remove('active');
                    textInput.classList.remove('text-border-active');
                    calcInput.classList.remove('calc-border-active');
                }
            });
        }

        function evaluateRow(index) {
            let row = rows[index];
            let expr = row.expression.trim().replace(/x|X|×|\*/g, '*');
            if (!expr) { row.result = 0; updateGrandTotalOnly(); return; }
            try {
                let res = Function('"use strict"; return (' + expr.replace(/[^0-9+\-*/().]/g, '') + ')')();
                row.result = isNaN(res) || !isFinite(res) ? 0 : (Number.isInteger(res) ? res : parseFloat(res.toFixed(6)));
            } catch (e) {
                row.result = 0;
            }
            updateGrandTotalOnly();
        }

        function updateGrandTotalOnly() {
            let totalSum = 0, positiveSum = 0, negativeSum = 0;
            const showCurrency = showCurrencyCheckbox.checked;
            rows.forEach((row, index) => {
                const rowDivs = screenContainer.querySelectorAll('.calc-row');
                if (rowDivs[index]) {
                    rowDivs[index].querySelector('.calc-output').innerText = row.result !== 0 ? (row.result < 0 ? `(${Math.abs(row.result)})` : row.result) : '';
                    rowDivs[index].querySelector('.row-currency').innerText = showCurrency ? 'جنيه' : '';
                }
                totalSum += row.result;
                if (row.result > 0) positiveSum += row.result;
                if (row.result < 0) negativeSum += row.result;
            });
            grandTotalEl.innerText = totalSum;
            positiveTotalValEl.innerText = showPositiveCheckbox.checked ? positiveSum : '';
            negativeTotalValEl.innerText = showNegativeCheckbox.checked ? negativeSum : '';
        }

        function exportToExcel() {
            const showCurrency = showCurrencyCheckbox.checked;
            let dataToExport = rows.map((r, i) => ({
                "السطر": i + 1,
                "الملاحظات": r.textExpression,
                "النتيجة": showCurrency ? `${r.result} جنيه` : r.result,
                "العملية الحسابية": r.expression.replace(/\*/g, 'x')
            }));
            const worksheet = XLSX.utils.json_to_sheet(dataToExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "النتائج");
            XLSX.writeFile(workbook, "Calculator_Results.xlsx");
        }

        function exportToWord() {
            const showCurrency = showCurrencyCheckbox.checked;
            let htmlContent = `<html dir="rtl"><head><meta charset='utf-8'></head><body><table border="1" style="border-collapse:collapse; width:100%;">`;
            htmlContent += `<tr><th>السطر</th><th>الملاحظات</th><th>النتيجة</th><th>العملية الحسابية</th></tr>`;
            rows.forEach((r, i) => {
                htmlContent += `<tr><td>${i+1}</td><td>${r.textExpression}</td><td>${showCurrency ? `${r.result} جنيه` : r.result}</td><td>${r.expression.replace(/\*/g, 'x')}</td></tr>`;
            });
            htmlContent += `</table></body></html>`;
            let blob = new Blob(['\ufeff' + htmlContent], { type: 'application/msword' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url; a.download = 'Calculator_Results.doc';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        function exportToPDF() {
            const opt = { margin: 10, filename: 'Calculator_Results.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
            html2pdf().from(calculatorContainer).set(opt).save();
        }

        function exportToTXT() {
            let text = "";
            rows.forEach((r, i) => {
                text += `${i + 1}. [${r.textExpression}] = ${r.expression} ← ${r.result}\n`;
            });
            let blob = new Blob([text], { type: "text/plain;charset=utf-8" });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url; a.download = 'Calculator_Results.txt';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        function exportToImage() {
            html2canvas(calculatorContainer).then(canvas => {
                let link = document.createElement('a');
                link.download = 'Calculator_Results.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // التشغيل الأولي الافتراضي مع التركيز حصرياً على حقل العمليات الحسابية (calc)
        renderCalculator('calc');
    </script>
</body>
</html>
