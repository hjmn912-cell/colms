<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>آلة حاسبة الأسطر المتعددة</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .calculator-container {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            background-color: #111827;
            border-radius: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid #334155;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            touch-action: none;
        }

        /* حواف السحب والتوسيع (مثل نوافذ الويندوز) */
        .resize-edge {
            position: absolute;
            z-index: 10000;
        }
        .resize-edge.right { top: 0; right: 0; width: 12px; height: 100%; cursor: e-resize; }
        .resize-edge.left { top: 0; left: 0; width: 12px; height: 100%; cursor: w-resize; }
        .resize-edge.bottom { bottom: 0; left: 0; width: 100%; height: 12px; cursor: s-resize; }
        .resize-edge.corner-br { bottom: 0; right: 0; width: 20px; height: 20px; cursor: nwse-resize; }

        /* سطر المعاينة العلوي للموبايل */
        .mobile-preview-top-bar {
            display: none;
            background-color: #020617;
            color: #38bdf8;
            padding: 6px 10px;
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 2px solid #38bdf8;
            width: 100%;
            text-align: right;
            white-space: nowrap;
            overflow-x: auto;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            justify-content: space-between;
            align-items: center;
        }

        .mobile-preview-result {
            color: #10b981;
            font-size: 1.1rem;
            font-weight: 700;
            margin-right: 15px;
        }

        /* الكومبو بوكس الصغير جداً بدون اسم */
        .mobile-combo-box {
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 3px 5px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            outline: none;
            margin-left: 6px;
            height: 28px;
            width: 32px;
            text-align: center;
        }

        /* الأيقونة العائمة الصغيرة التي تظهر عند فتح الكيبورد */
        .floating-keyboard-action-btn {
            position: fixed;
            bottom: 260px;
            left: 15px;
            background-color: #38bdf8;
            color: #0b0f19;
            border: 2px solid #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            z-index: 100000;
            cursor: pointer;
            animation: bounceIn 0.3s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .sticky-top-section {
            position: relative;
            background-color: #030712;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            flex-shrink: 0;
        }

        .top-controls-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #1f2937;
            gap: 8px;
            position: relative;
            flex-wrap: wrap;
        }

        .left-controls-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .options-dropdown {
            position: relative;
            display: inline-block;
        }

        .options-btn, .refresh-btn {
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .refresh-btn {
            padding: 6px 10px;
            font-size: 1rem;
            height: 32px;
            width: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .options-btn:hover, .refresh-btn:hover {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .options-dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 110%;
            background-color: #1e293b;
            min-width: 170px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.5);
            border-radius: 6px;
            z-index: 2000;
            border: 1px solid #38bdf8;
            padding: 8px 10px;
            flex-direction: column;
            gap: 8px;
        }

        .options-dropdown-content.active {
            display: flex;
        }

        .option-toggle-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            font-size: 0.9rem;
            color: #f8fafc;
            white-space: nowrap;
        }

        .option-toggle-label input {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #38bdf8;
        }

        .totals-summary-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            flex: 1;
        }

        .sub-totals-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 1.1rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .summary-item input[type="checkbox"] {
            width: 15px;
            height: 15px;
            cursor: pointer;
            accent-color: #38bdf8;
        }

        .positive-sum {
            color: #10b981;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .negative-sum {
            color: #ef4444;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .calculator-header {
            background-color: #030712;
            padding: 8px 12px;
            border-bottom: 2px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 8px;
            position: relative;
        }

        .total-value-container {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 6px;
            flex: 2;
            white-space: nowrap;
            overflow: visible;
        }

        .total-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #38bdf8;
            white-space: nowrap;
        }

        .total-currency {
            font-size: 1rem;
            color: #38bdf8;
            font-weight: 600;
            white-space: nowrap;
        }

        .total-value.negative {
            color: #ef4444 !important;
        }

        .header-right-group {
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: flex-end;
        }

        .designer-credit {
            font-size: 0.7rem;
            color: #6b7280;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .top-action-btn, .top-notes-focus-btn, .toggle-hide-btn, .top-next-row-btn {
            background-color: #1e293b;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .top-action-btn, .top-notes-focus-btn {
            display: none;
        }

        .toggle-hide-btn:hover, .top-next-row-btn:hover {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .toggle-hide-btn.active-mode {
            background-color: #eab308;
            color: #000;
            border-color: #facc15;
            box-shadow: 0 0 8px rgba(234, 179, 8, 0.6);
        }

        .export-dropdown {
            position: relative;
            display: inline-block;
            text-align: left;
        }

        .export-btn {
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .export-btn:hover {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            left: 0;
            background-color: #1e293b;
            min-width: 220px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.5);
            border-radius: 6px;
            z-index: 2000;
            border: 1px solid #38bdf8;
            overflow: hidden;
        }

        .dropdown-content button {
            color: #f8fafc;
            padding: 8px 12px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            text-align: right;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            border-bottom: 1px solid #334155;
        }

        .dropdown-content button:last-child {
            border-bottom: none;
        }

        .dropdown-content button:hover {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .dropdown-divider {
            height: 1px;
            background-color: #38bdf8;
            margin: 2px 0;
        }

        .export-dropdown.active .dropdown-content {
            display: block;
        }

        .calculator-screen {
            background-color: #0f172a;
            padding: 10px 0; /* إزالة الحشو الأفقي من الشاشة ليفتح الجانب الأيسر بالكامل */
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden;
            gap: 8px;
            width: 100%;
            -webkit-overflow-scrolling: touch;
            will-change: transform;
        }

        /* السطر (الإطار الخارجي): مفتوح من الجهة اليسارية لتخرج الخلية وتلتصق بحافة الشاشة */
        .calc-row {
            display: flex;
            flex-direction: column;
            background-color: #1e293b;
            padding: 8px 6px 8px 0px; /* فتح الحافة اليسارية بالكامل بـ 0px */
            border-radius: 8px 0 0 8px; /* تدوير الجهة اليمنى فقط وترك اليسرى ممتدة مفتوحة */
            border: 1px solid transparent;
            border-left: none !important; /* إلغاء الحد الأيسر للإطار الخارجي تماماً ليصبح مفتوحاً */
            transition: border-color 0.15s ease;
            gap: 8px;
            width: 100%;
            min-width: 0 !important;
            touch-action: pan-y;
        }

        .calc-row.active {
            border-color: #38bdf8;
            background-color: #1e293b;
        }

        .calc-row-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
            width: 100%;
        }

        .inputs-group {
            display: flex;
            gap: 4px;
            flex-grow: 1;
            align-items: center;
            width: 100%;
            min-width: 0;
        }

        /* خلية الملاحظات (اليمين) أكبر وأوسع من خلية العملية الحسابية في كل الأحوال */
        .text-input-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 3; /* مساحة أكبر لضمان أن تكون دائماً أكبر وأوسع */
            min-width: 0;
            padding-right: 6px; /* مسافة بسيطة من اليمين داخل الإطار */
        }

        .calc-input-wrapper {
            display: flex;
            align-items: center;
            gap: 2px;
            flex: 1.5; /* مساحة أقل نسبياً مقارنة بالملاحظات، وتلتصق بالحافة اليسرى تماماً */
            min-width: 0;
        }

        .mic-wrapper {
            display: flex;
            align-items: center;
            gap: 2px;
            padding-left: 6px;
        }

        .global-select-checkbox, .calc-select-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #eab308;
            flex-shrink: 0;
        }

        .row-mobile-arrow-btn, .row-calc-arrow-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            font-size: 0.8rem;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .row-mobile-arrow-btn:active, .row-calc-arrow-btn:active {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .row-keypad-container {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            position: fixed;
            bottom: 25px;
            left: 0;
            padding: 0 10px;
            z-index: 9999;
            pointer-events: none;
        }

        .row-mini-keypad {
            pointer-events: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background-color: #030712;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #38bdf8;
            width: 100%;
            max-width: 100%;
            direction: ltr;
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.95);
            touch-action: none;
            cursor: grab;
            user-select: none;
        }

        .row-mini-keypad:active {
            cursor: grabbing;
        }

        .keypad-header {
            grid-column: span 4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
            background-color: #1e293b;
            padding: 6px 10px;
            border-radius: 6px;
        }

        .keypad-drag-title {
            color: #38bdf8;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .close-keypad-btn {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        .close-keypad-btn:hover {
            background-color: #ef4444;
            color: #fff;
        }

        .mini-key-btn {
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 14px 6px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            transition: all 0.15s;
            user-select: none;
        }

        .mini-key-btn:hover {
            background-color: #38bdf8;
            color: #0b0f19;
            border-color: #38bdf8;
        }

        .mini-key-btn.op {
            background-color: #0f172a;
            color: #38bdf8;
            border-color: #38bdf8;
        }

        .mini-key-btn.backspace {
            background-color: #331f29;
            color: #ef4444;
            border-color: #ef4444;
        }

        .mini-key-btn.backspace:hover {
            background-color: #ef4444;
            color: #fff;
        }

        .mini-key-btn.enter-key {
            background-color: #065f46;
            color: #34d399;
            border-color: #059669;
            font-size: 1.05rem;
        }

        .mini-key-btn.enter-key:hover {
            background-color: #10b981;
            color: #ffffff;
        }

        .mini-key-btn.enter-open-key {
            background-color: #1e1b4b;
            color: #a78bfa;
            border-color: #8b5cf6;
            font-size: 1.05rem;
        }

        .mini-key-btn.enter-open-key:hover {
            background-color: #8b5cf6;
            color: #ffffff;
        }

        .mini-key-btn.kbd-key {
            background-color: #1e1b4b;
            color: #818cf8;
            border-color: #6366f1;
            font-size: 0.95rem;
        }

        .mini-key-btn.kbd-key:hover {
            background-color: #6366f1;
            color: #ffffff;
        }

        .mini-key-btn.nav-key {
            background-color: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            font-size: 1.05rem;
        }

        .mini-key-btn.nav-key:hover {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .mini-key-btn.clear-key {
            background-color: #7f1d1d;
            color: #fca5a5;
            border-color: #ef4444;
            font-size: 1.05rem;
        }

        .mini-key-btn.clear-key:hover {
            background-color: #ef4444;
            color: #ffffff;
        }

        .text-input, .calc-input {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid #334155;
            border-radius: 6px;
            padding: 6px 6px;
            color: #38bdf8;
            font-size: 1.3rem;
            font-weight: bold;
            outline: none;
            font-family: inherit;
            width: 100%;
            transition: border-color 0.15s, background-color 0.15s, box-shadow 0.15s;
        }

        .text-input {
            flex: 1;
            resize: none;
            overflow-y: hidden;
            min-height: 38px;
            line-height: 1.2;
        }

        /* خلية الحسابات تلتصق تماماً بالحافة اليسارية للشاشة بدون أي زوايا مدورة من اليسار لتندمج مع الحافة */
        .calc-input {
            width: 100%;
            height: 38px;
            direction: ltr;
            text-align: right;
            font-size: 1.4rem;
            border-left: none !important;
            border-top-left-radius: 0 !important;
            border-bottom-left-radius: 0 !important;
        }

        .text-border-active, .calc-border-active {
            border-color: #38bdf8 !important;
            background: rgba(56, 189, 248, 0.1) !important;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4) !important;
        }

        .calc-row.hidden-calc .calc-input {
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .calc-row.hidden-text .text-input {
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .calc-row.hidden-mic .mic-wrapper {
            display: none !important;
        }

        .calc-row.hidden-tools .row-mobile-arrow-btn,
        .calc-row.hidden-tools .row-calc-arrow-btn {
            display: none !important;
        }

        .calc-output-container {
            display: flex;
            align-items: baseline;
            gap: 3px;
            min-width: 70px;
            text-align: left;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .calc-output {
            font-size: 1.2rem;
            font-weight: 700;
            color: #10b981;
            white-space: nowrap;
        }

        .row-currency {
            font-size: 0.9rem;
            color: #38bdf8;
            font-weight: 600;
            white-space: nowrap;
        }

        .calc-output.negative {
            color: #ef4444 !important;
        }

        .mic-btn {
            background: transparent;
            border: none;
            color: #6b7280;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 2px 2px;
            border-radius: 6px;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .mic-btn:hover {
            background-color: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
        }

        .mic-btn.listening {
            color: #ef4444 !important;
            animation: pulse 1.2s infinite;
        }

        .mic-btn.continuous-mode {
            background-color: rgba(239, 68, 68, 0.2) !important;
            border: 1px solid #ef4444 !important;
            border-radius: 50%;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .keyboard-hint {
            padding: 6px 10px;
            text-align: center;
            font-size: 0.75rem;
            color: #6b7280;
            background-color: #111827;
            border-top: 1px solid #1f2937;
            width: 100%;
            flex-shrink: 0;
        }

        .keyboard-hint span {
            color: #38bdf8;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .calculator-header {
                flex-direction: column;
                gap: 4px;
                padding: 6px;
            }
            .total-value-container {
                width: 100%;
                justify-content: center;
            }
            .total-value {
                font-size: 1.5rem;
            }
            .header-right-group {
                width: 100%;
                justify-content: space-between;
            }
            .calc-output-container {
                min-width: 55px;
            }
            .text-input, .calc-input, .calc-output {
                font-size: 1.15rem;
                height: 36px;
                min-height: 36px;
            }
        }
    </style>
</head>
<body>

    <div class="calculator-container" id="calculatorContainer">
        
        <!-- حواف السحب والتوسيع (مثل نوافذ الويندوز) -->
        <div class="resize-edge right" id="edgeRight"></div>
        <div class="resize-edge left" id="edgeLeft"></div>
        <div class="resize-edge bottom" id="edgeBottom"></div>
        <div class="resize-edge corner-br" id="edgeCornerBR"></div>

        <!-- النقطة المؤشرة الزرقاء في أعلى اليسار للتحقق من التحديث -->
        <div id="updateIndicatorDot" style="position: fixed; top: 8px; left: 12px; width: 12px; height: 12px; background-color: #38bdf8; border-radius: 50%; z-index: 99999; box-shadow: 0 0 8px #38bdf8;" title="مؤشر التحديث النشط (أزرق)"></div>

        <!-- الأيقونة العائمة الصغيرة التي تظهر عند فتح الكيبورد 🚀 -->
        <button type="button" id="floatingKeyboardNewRowBtn" class="floating-keyboard-action-btn" title="الانتقال للخلية التالية وفتح الكيبورد" onclick="handleSmartNextCellClick()">🚀</button>

        <!-- سطر المعاينة العلوي للموبايل -->
        <div id="mobilePreviewTopBar" class="mobile-preview-top-bar" style="display:none;">
            <div style="display: flex; align-items: center; gap: 4px; overflow-x: auto; flex: 1;">
                <!-- كومبو بوكس صغير جداً بدون اسم -->
                <select id="mobileControlCombo" class="mobile-combo-box" onchange="handleMobileComboChange(this)">
                    <option value="" disabled selected>⚙️</option>
                    <option value="toggle_mics">إظهار/إخفاء المايكات</option>
                    <option value="toggle_tools">إظهار/إخفاء الأدوات</option>
                </select>
                <span id="previewTextContent"></span>
            </div>
            <span id="previewResultContent" class="mobile-preview-result"></span>
        </div>

        <div class="sticky-top-section" id="stickyTopSection">
            <div class="top-controls-wrapper">
                <div class="left-controls-group">
                    <!-- الخيارات -->
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <input type="checkbox" id="hideOptionsCheckbox" class="global-select-checkbox" style="display:none;" onchange="updateGlobalHides()">
                        <div class="options-dropdown" id="optionsDropdown">
                            <button class="options-btn" type="button" onclick="toggleOptionsMenu(event)">
                                الخيارات <span>▼</span>
                            </button>
                            <div class="options-dropdown-content" id="optionsDropdownContent">
                                <label class="option-toggle-label">
                                    <input type="checkbox" id="showCurrencyCheckbox" checked onchange="renderCalculator()">
                                    إظهار كلمة جنيه
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- زر إعادة التحميل -->
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <input type="checkbox" id="hideRefreshCheckbox" class="global-select-checkbox" style="display:none;" onchange="updateGlobalHides()">
                        <button class="refresh-btn" id="refreshBtnEl" type="button" title="إعادة تحميل الصفحة" onclick="location.reload()">
                            🔄
                        </button>
                    </div>
                </div>

                <div class="totals-summary-bar">
                    <div class="sub-totals-row">
                        <!-- مجموع العمليات الموجبة -->
                        <div style="display: flex; align-items: center; gap: 4px;">
                            <input type="checkbox" id="hidePositiveCheckbox" class="global-select-checkbox" style="display:none;" onchange="updateGlobalHides()">
                            <div class="summary-item">
                                <input type="checkbox" id="showPositiveCheckbox" onchange="renderCalculator()">
                                <span id="positiveTotalVal" class="positive-sum"></span>
                            </div>
                        </div>

                        <!-- مجموع العمليات السالبة -->
                        <div style="display: flex; align-items: center; gap: 4px;">
                            <input type="checkbox" id="hideNegativeCheckbox" class="global-select-checkbox" style="display:none;" onchange="updateGlobalHides()">
                            <div class="summary-item">
                                <input type="checkbox" id="showNegativeCheckbox" onchange="renderCalculator()">
                                <span id="negativeTotalVal" class="negative-sum"></span>
                            </div>
                        </div>
                    </div>

                    <div class="total-value-container">
                        <!-- الإجمالي النهائي -->
                        <div style="display: flex; align-items: center; gap: 4px;">
                            <input type="checkbox" id="hideGrandTotalCheckbox" class="global-select-checkbox" style="display:none;" onchange="updateGlobalHides()">
                            <div id="grandTotal" class="total-value">0</div>
                        </div>
                        <!-- كلمة جنيه المجاورة للإجمالي النهائي -->
                        <div style="display: flex; align-items: center; gap: 4px;">
                            <input type="checkbox" id="hideGrandCurrencyCheckbox" class="global-select-checkbox" style="display:none;" onchange="updateGlobalHides()">
                            <div id="grandTotalCurrency" class="total-currency">جنيه</div>
                        </div>
                    </div>
                </div>

                <div style="width: 60px;"></div>
            </div>

            <div class="calculator-header">
                <div class="header-right-group">
                    <button type="button" id="topNotesFocusBtn" class="top-notes-focus-btn" title="النزول للسطر التالي أو إنشاء جديد في الملاحظات" onclick="handleTopNotesFocusClick()">📝</button>
                    <button type="button" id="topActionBtn" class="top-action-btn" title="النزول للسطر التالي أو إنشاء جديد في العملية الحسابية" onclick="handleTopActionBtnClick()">📄</button>
                    
                    <!-- زر الانتقال للخلية التي تحتها مباشرة وفتح الكيبورد 🚀 -->
                    <button type="button" class="top-next-row-btn" title="الانتقال للخلية التي تحتها مباشرة وفتح كيبورد الموبايل" onclick="handleSmartNextCellClick()">🚀</button>

                    <span class="designer-credit">designed by Sami Arouj</span>
                    
                    <!-- زر إخفاء/إظهار الشامل -->
                    <button type="button" id="toggleHideBtn" class="toggle-hide-btn" title="تحديد العناصر المراد إخفاؤها" onclick="toggleHideSelectionMode()">
                        👁️
                    </button>

                    <!-- زر التصدير ومشاركة (مصغر وبدون نص) -->
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <input type="checkbox" id="hideExportCheckbox" class="global-select-checkbox" style="display:none;" onchange="updateGlobalHides()">
                        <div class="export-dropdown" id="exportDropdown">
                            <button class="export-btn" title="تصدير ومشاركة" onclick="toggleExportMenu(event)">
                                📊
                            </button>
                            <div class="dropdown-content">
                                <button onclick="exportToExcel()">📊 إكسيل (Excel)</button>
                                <button onclick="exportToWord()">📝 وورد (Word)</button>
                                <button onclick="exportToPDF()">📄 بي دي إف (PDF)</button>
                                <button onclick="exportToTXT()">📄 تصدير ملف نصي (TXT)</button>
                                <button onclick="exportToImage()">🖼️ تنزيل صورة</button>
                                
                                <div class="dropdown-divider"></div>
                                
                                <button onclick="openPhoneWhatsApp()">📱 فتح واتساب الهاتف</button>
                                <button onclick="openPhoneMessenger()">💬 فتح ماسنجر الهاتف</button>
                                <button onclick="copyReportTextOnly()">📋 نسخ التقرير نصياً</button>

                                <div class="dropdown-divider"></div>

                                <button onclick="shareLinkToWhatsApp()">💬 إرسال التقرير للواتساب</button>
                                <button onclick="shareLinkToMessenger()">⚡ إرسال التقرير للماسنجر</button>
                                <button onclick="shareLinkToSMS()">📱 إرسال التقرير عبر رسالة نصية (SMS)</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="screenContainer" class="calculator-screen"></div>

        <div class="keyboard-hint">
            <span>الأسهم</span> للتحرك بين الأسطر والحقول | <span>Home</span> للحساب بالقوة | <span>Page Up</span> لتجاهل ما قبل المؤشر | <span>Enter</span> للسطر التالي أو جديد
        </div>
    </div>

    <script>
        const screenContainer = document.getElementById('screenContainer');
        const calculatorContainer = document.getElementById('calculatorContainer');
        const mobilePreviewTopBar = document.getElementById('mobilePreviewTopBar');
        const previewTextContent = document.getElementById('previewTextContent');
        const previewResultContent = document.getElementById('previewResultContent');
        const mobileControlCombo = document.getElementById('mobileControlCombo');
        const floatingKeyboardNewRowBtn = document.getElementById('floatingKeyboardNewRowBtn');
        const stickyTopSection = document.getElementById('stickyTopSection');
        const grandTotalEl = document.getElementById('grandTotal');
        const grandTotalCurrencyEl = document.getElementById('grandTotalCurrency');
        const showCurrencyCheckbox = document.getElementById('showCurrencyCheckbox');
        const showPositiveCheckbox = document.getElementById('showPositiveCheckbox');
        const showNegativeCheckbox = document.getElementById('showNegativeCheckbox');
        const positiveTotalValEl = document.getElementById('positiveTotalVal');
        const negativeTotalValEl = document.getElementById('negativeTotalVal');
        const topActionBtn = document.getElementById('topActionBtn');
        const topNotesFocusBtn = document.getElementById('topNotesFocusBtn');
        const toggleHideBtn = document.getElementById('toggleHideBtn');

        const optionsDropdownEl = document.getElementById('optionsDropdown');
        const refreshBtnEl = document.getElementById('refreshBtnEl');
        const exportDropdownEl = document.getElementById('exportDropdown');

        let isSelectionModeActive = false;
        
        let globalHideMics = true;
        let globalHideTools = true;

        function detectMobileEnvironment() {
            const ua = navigator.userAgent;
            const width = window.innerWidth;
            const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) || width <= 1024;
            
            if (!isMobileDevice) {
                return 'desktop';
            }

            const isDesktopModeOnMobile = width > 768 && !/Mobi/i.test(ua);
            if (isDesktopModeOnMobile) {
                return 'mobile-desktop';
            } else {
                return 'mobile-normal';
            }
        }

        const env = detectMobileEnvironment();
        const isMobileNormal = env === 'mobile-normal';
        const isMobileAny = env !== 'desktop';

        if (isMobileAny) {
            topActionBtn.style.display = 'inline-flex';
            topNotesFocusBtn.style.display = 'inline-flex';
        }

        if (isMobileNormal) {
            mobilePreviewTopBar.style.display = 'flex';
        }

        // كشف فتح كيبورد الموبايل
        let initialWindowHeight = window.innerHeight;
        window.addEventListener('resize', () => {
            if (isMobileAny) {
                if (window.innerHeight < initialWindowHeight - 120) {
                    floatingKeyboardNewRowBtn.style.display = 'flex';
                } else {
                    floatingKeyboardNewRowBtn.style.display = 'none';
                }
            }
        });

        function handleSmartNextCellClick() {
            evaluateRow(activeRowIndex);
            closeAllPads();

            let currentColumn = activeFieldIndex || 'text';

            if (activeRowIndex < rows.length - 1) {
                activeRowIndex++;
            } else {
                rows.push({ 
                    textExpression: '', expression: '', result: 0, forceCalc: false, ignoreBeforeIndex: 0, 
                    isCalcVisible: true, isTextVisible: true, isMicVisible: true, isCalcPadVisible: false, isTextPadVisible: false
                });
                activeRowIndex = rows.length - 1;
            }

            activeFieldIndex = currentColumn;
            renderCalculator(activeFieldIndex);
            scrollToActiveRow();

            setTimeout(() => {
                const targetEl = screenContainer.querySelector(`.calc-row.active .${activeFieldIndex === 'text' ? 'text-input' : 'calc-input'}`);
                if (targetEl) {
                    targetEl.removeAttribute('readonly');
                    targetEl.removeAttribute('inputmode');
                    targetEl.focus();
                }
            }, 30);

            updateMobilePreviewText();
        }

        function handleMobileComboChange(selectEl) {
            const val = selectEl.value;
            if (val === 'toggle_mics') {
                globalHideMics = !globalHideMics;
            } else if (val === 'toggle_tools') {
                globalHideTools = !globalHideTools;
            }
            selectEl.selectedIndex = 0;
            renderCalculator();
        }

        let currentResizeDirection = null;
        let startX = 0, startY = 0;
        let startW = 0, startH = 0, startT = 0, startL = 0;

        function initResize(dir, e) {
            currentResizeDirection = dir;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX;
            startY = clientY;
            startW = calculatorContainer.offsetWidth;
            startH = calculatorContainer.offsetHeight;
            startT = calculatorContainer.offsetTop;
            startL = calculatorContainer.offsetLeft;
        }

        document.getElementById('edgeRight').addEventListener('mousedown', (e) => initResize('right', e));
        document.getElementById('edgeRight').addEventListener('touchstart', (e) => initResize('right', e), { passive: true });

        document.getElementById('edgeLeft').addEventListener('mousedown', (e) => initResize('left', e));
        document.getElementById('edgeLeft').addEventListener('touchstart', (e) => initResize('left', e), { passive: true });

        document.getElementById('edgeBottom').addEventListener('mousedown', (e) => initResize('bottom', e));
        document.getElementById('edgeBottom').addEventListener('touchstart', (e) => initResize('bottom', e), { passive: true });

        document.getElementById('edgeCornerBR').addEventListener('mousedown', (e) => initResize('cornerBR', e));
        document.getElementById('edgeCornerBR').addEventListener('touchstart', (e) => initResize('cornerBR', e), { passive: true });

        window.addEventListener('mousemove', doResize);
        window.addEventListener('touchmove', doResize, { passive: true });

        window.addEventListener('mouseup', stopResize);
        window.addEventListener('touchend', stopResize);

        function doResize(e) {
            if (!currentResizeDirection) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const dx = clientX - startX;
            const dy = clientY - startY;

            if (currentResizeDirection === 'right') {
                let newW = Math.max(250, startW + dx);
                calculatorContainer.style.width = newW + 'px';
            } else if (currentResizeDirection === 'left') {
                let newW = Math.max(250, startW - dx);
                let newL = startL + dx;
                if (newW > 250) {
                    calculatorContainer.style.width = newW + 'px';
                    calculatorContainer.style.left = newL + 'px';
                }
            } else if (currentResizeDirection === 'bottom') {
                let newH = Math.max(200, startH + dy);
                calculatorContainer.style.height = newH + 'px';
            } else if (currentResizeDirection === 'cornerBR') {
                let newW = Math.max(250, startW + dx);
                let newH = Math.max(200, startH + dy);
                calculatorContainer.style.width = newW + 'px';
                calculatorContainer.style.height = newH + 'px';
            }
        }

        function stopResize() {
            currentResizeDirection = null;
        }

        let rows = [
            { 
                textExpression: '', 
                expression: '', 
                result: 0, 
                forceCalc: false, 
                ignoreBeforeIndex: 0, 
                isCalcVisible: true, 
                isTextVisible: true,
                isMicVisible: true,
                isCalcPadVisible: false, 
                isTextPadVisible: false
            }
        ];
        let activeRowIndex = 0;
        let activeFieldIndex = 'text';

        let activeSpeechRecognition = null;
        let isMicContinuousMode = false;
        let currentActiveMicBtn = null;
        let micClickTimer = null;

        function toggleHideSelectionMode() {
            isSelectionModeActive = !isSelectionModeActive;
            
            const checkboxes = document.querySelectorAll('.global-select-checkbox');
            checkboxes.forEach(cb => {
                cb.style.display = isSelectionModeActive ? 'inline-block' : 'none';
            });

            if (isSelectionModeActive) {
                toggleHideBtn.classList.add('active-mode');
            } else {
                toggleHideBtn.classList.remove('active-mode');
            }
            
            renderCalculator();
        }

        function updateGlobalHides() {
            const hideOptions = document.getElementById('hideOptionsCheckbox').checked;
            const hideRefresh = document.getElementById('hideRefreshCheckbox').checked;
            const hideExport = document.getElementById('hideExportCheckbox').checked;
            
            optionsDropdownEl.style.display = hideOptions ? 'none' : 'inline-block';
            refreshBtnEl.style.display = hideRefresh ? 'none' : 'inline-flex';
            exportDropdownEl.style.display = hideExport ? 'none' : 'inline-block';
            
            document.getElementById('positiveTotalVal').parentElement.parentElement.style.display = document.getElementById('hidePositiveCheckbox').checked ? 'none' : 'flex';
            document.getElementById('negativeTotalVal').parentElement.parentElement.style.display = document.getElementById('hideNegativeCheckbox').checked ? 'none' : 'flex';
            
            grandTotalEl.style.display = document.getElementById('hideGrandTotalCheckbox').checked ? 'none' : 'block';
            grandTotalCurrencyEl.style.display = document.getElementById('hideGrandCurrencyCheckbox').checked ? 'none' : 'block';

            if (isMobileNormal) {
                if (hideOptions && hideRefresh && hideExport && document.getElementById('hideGrandTotalCheckbox').checked) {
                    mobilePreviewTopBar.style.display = 'none';
                } else {
                    mobilePreviewTopBar.style.display = 'flex';
                }
            }
        }

        function closeAllPads() {
            rows.forEach(r => {
                r.isCalcPadVisible = false;
                r.isTextPadVisible = false;
            });
        }

        function handleTopActionBtnClick() {
            evaluateRow(activeRowIndex);
            closeAllPads();

            if (activeRowIndex < rows.length - 1) {
                activeRowIndex++;
                activeFieldIndex = 'calc';
                renderCalculator('calc');
                scrollToActiveRow();
            } else {
                rows.push({ 
                    textExpression: '', expression: '', result: 0, forceCalc: false, ignoreBeforeIndex: 0, 
                    isCalcVisible: true, isTextVisible: true, isMicVisible: true, isCalcPadVisible: false, isTextPadVisible: false
                });
                activeRowIndex = rows.length - 1;
                activeFieldIndex = 'calc';
                renderCalculator('calc');
                screenContainer.scrollTop = screenContainer.scrollHeight;
            }
        }

        function handleTopNotesFocusClick() {
            evaluateRow(activeRowIndex);
            closeAllPads();

            if (activeRowIndex < rows.length - 1) {
                activeRowIndex++;
                activeFieldIndex = 'text';
                renderCalculator('text');
                scrollToActiveRow();
            } else {
                rows.push({ 
                    textExpression: '', expression: '', result: 0, forceCalc: false, ignoreBeforeIndex: 0, 
                    isCalcVisible: true, isTextVisible: true, isMicVisible: true, isCalcPadVisible: false, isTextPadVisible: false
                });
                activeRowIndex = rows.length - 1;
                activeFieldIndex = 'text';
                renderCalculator('text');
                screenContainer.scrollTop = screenContainer.scrollHeight;
            }
        }

        function goToFirstRow() {
            if (rows.length > 0) {
                activeRowIndex = 0;
                renderCalculator(activeFieldIndex);
                scrollToActiveRow();
            }
        }

        function goToLastRow() {
            if (rows.length > 0) {
                activeRowIndex = rows.length - 1;
                renderCalculator(activeFieldIndex);
                scrollToActiveRow();
            }
        }

        function clearCurrentField() {
            if (rows[activeRowIndex]) {
                if (activeFieldIndex === 'text') {
                    rows[activeRowIndex].textExpression = '';
                } else {
                    rows[activeRowIndex].expression = '';
                    rows[activeRowIndex].result = 0;
                    rows[activeRowIndex].forceCalc = false;
                    rows[activeRowIndex].ignoreBeforeIndex = 0;
                }
                renderCalculator(activeFieldIndex);
            }
        }

        function scrollToActiveRow() {
            const activeRowEl = screenContainer.children[activeRowIndex];
            if (activeRowEl) {
                activeRowEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function toggleOptionsMenu(e) {
            e.stopPropagation();
            const dropdown = document.getElementById('optionsDropdownContent');
            const exportDropdown = document.querySelector('#exportDropdown .dropdown-content');
            if (exportDropdown) exportDropdown.parentElement.classList.remove('active');
            dropdown.classList.toggle('active');
        }

        function toggleExportMenu(e) {
            e.stopPropagation();
            const dropdown = document.getElementById('exportDropdown');
            const optionsDropdown = document.getElementById('optionsDropdownContent');
            if (optionsDropdown) optionsDropdown.classList.remove('active');
            dropdown.classList.toggle('active');
        }

        window.addEventListener('click', (e) => {
            const optionsDropdown = document.getElementById('optionsDropdownContent');
            const exportDropdown = document.getElementById('exportDropdown');
            
            if (optionsDropdown && !optionsDropdown.contains(e.target) && !e.target.closest('.options-btn')) {
                optionsDropdown.classList.remove('active');
            }
            if (exportDropdown && !exportDropdown.contains(e.target)) {
                exportDropdown.classList.remove('active');
            }
        });

        function updateMobilePreviewText() {
            if (!isMobileNormal) return;
            const currentRow = rows[activeRowIndex];
            if (!currentRow) return;

            let currentText = activeFieldIndex === 'text' ? currentRow.textExpression : currentRow.expression.replace(/\*/g, 'x');
            previewTextContent.innerText = currentText;

            if (currentRow.result !== '' && currentRow.result !== 0) {
                const formatted = formatDisplayValue(currentRow.result);
                const showCurrency = showCurrencyCheckbox.checked;
                previewResultContent.innerText = `${formatted.text} ${showCurrency ? 'جنيه' : ''}`;
            } else {
                previewResultContent.innerText = '';
            }
        }

        function insertValueForField(index, field, val) {
            activeRowIndex = index;
            activeFieldIndex = field;
            if (field === 'text') {
                rows[index].textExpression += val;
                renderCalculator('text');
            } else {
                let actualVal = (val === 'x') ? '*' : val;
                rows[index].expression += actualVal;
                rows[index].forceCalc = false;
                evaluateRow(index);
                renderCalculator('calc');
            }
            updateMobilePreviewText();
        }

        function handleBackspaceForField(index, field) {
            activeRowIndex = index;
            activeFieldIndex = field;
            if (field === 'text') {
                let text = rows[index].textExpression;
                if (text.length > 0) {
                    rows[index].textExpression = text.substring(0, text.length - 1);
                    renderCalculator('text');
                }
            } else {
                let expr = rows[index].expression;
                if (expr.length > 0) {
                    rows[index].expression = expr.substring(0, expr.length - 1);
                    rows[index].forceCalc = false;
                    evaluateRow(index);
                    renderCalculator('calc');
                }
            }
            updateMobilePreviewText();
        }

        function openSystemKeyboard(index, field) {
            activeRowIndex = index;
            activeFieldIndex = field;
            closeAllPads(); 
            renderCalculator(field);

            setTimeout(() => {
                const activeEl = screenContainer.querySelector(`.calc-row.active .${field === 'text' ? 'text-input' : 'calc-input'}`);
                if (activeEl) {
                    activeEl.removeAttribute('readonly');
                    activeEl.removeAttribute('inputmode');
                    activeEl.focus();
                }
            }, 30);
            updateMobilePreviewText();
        }

        function openCalcPadForField(index, field) {
            activeRowIndex = index;
            activeFieldIndex = field;
            closeAllPads();

            if (field === 'text') {
                rows[index].isTextPadVisible = true;
            } else {
                rows[index].isCalcPadVisible = true;
            }
            renderCalculator(field);
            updateMobilePreviewText();
        }

        function addNewRowFromPad(index, field) {
            evaluateRow(index);
            closeAllPads();

            if (index < rows.length - 1) {
                activeRowIndex = index + 1;
                activeFieldIndex = field;
                renderCalculator(field);
                scrollToActiveRow();
            } else {
                rows.push({ 
                    textExpression: '', expression: '', result: 0, forceCalc: false, ignoreBeforeIndex: 0, 
                    isCalcVisible: true, isTextVisible: true, isMicVisible: true, isCalcPadVisible: false, isTextPadVisible: false
                });
                activeRowIndex = rows.length - 1;
                activeFieldIndex = field;
                renderCalculator(field);
                screenContainer.scrollTop = screenContainer.scrollHeight;
            }
            updateMobilePreviewText();
        }

        function addNewRowAndOpenTool(index, field) {
            evaluateRow(index);
            closeAllPads();

            let targetIndex;
            if (index < rows.length - 1) {
                targetIndex = index + 1;
            } else {
                rows.push({ 
                    textExpression: '', expression: '', result: 0, forceCalc: false, ignoreBeforeIndex: 0, 
                    isCalcVisible: true, isTextVisible: true, isMicVisible: true, isCalcPadVisible: false, isTextPadVisible: false
                });
                targetIndex = rows.length - 1;
            }

            activeRowIndex = targetIndex;
            activeFieldIndex = field;

            if (field === 'text') {
                renderCalculator(field);
                setTimeout(() => {
                    const activeText = screenContainer.querySelector('.calc-row.active .text-input');
                    if (activeText) {
                        activeText.removeAttribute('readonly');
                        activeText.removeAttribute('inputmode');
                        activeText.focus();
                    }
                }, 30);
            } else {
                rows[targetIndex].isCalcPadVisible = true;
                renderCalculator(field);
            }

            scrollToActiveRow();
            updateMobilePreviewText();
        }

        function formatDisplayValue(val) {
            if (typeof val === 'number') {
                if (val < 0) {
                    return { text: `(${Math.abs(val)})`, isNegative: true };
                }
                return { text: `${val}`, isNegative: false };
            }
            return { text: val, isNegative: false };
        }

        function createMiniKeypad(index, field) {
            const keypadDiv = document.createElement('div');
            keypadDiv.className = 'row-mini-keypad';
            
            const headerDiv = document.createElement('div');
            headerDiv.className = 'keypad-header';
            
            const titleSpan = document.createElement('span');
            titleSpan.className = 'keypad-drag-title';
            titleSpan.innerHTML = '☰ لوحة المفاتيح والآلة الحاسبة (اسحب للتحريك)';
            headerDiv.appendChild(titleSpan);

            const closeBtn = document.createElement('button');
            closeBtn.type = 'button';
            closeBtn.className = 'close-keypad-btn';
            closeBtn.innerText = 'إخفاء ✕';
            closeBtn.title = 'إخفاء الآلة الحاسبة';
            closeBtn.addEventListener('click', () => {
                if (field === 'text') {
                    rows[index].isTextPadVisible = false;
                } else {
                    rows[index].isCalcPadVisible = false;
                }
                renderCalculator(field);
            });
            headerDiv.appendChild(closeBtn);
            keypadDiv.appendChild(headerDiv);

            let isDraggingKeypad = false;
            let startX = 0, startY = 0;
            let currentX = 0, currentY = 0;

            keypadDiv.addEventListener('mousedown', startKeypadDrag);
            window.addEventListener('mousemove', onKeypadDrag);
            window.addEventListener('mouseup', stopKeypadDrag);

            keypadDiv.addEventListener('touchstart', startKeypadDrag, { passive: true });
            window.addEventListener('touchmove', onKeypadDrag, { passive: true });
            window.addEventListener('touchend', stopKeypadDrag);

            function startKeypadDrag(e) {
                if (e.target.closest('button')) return;
                isDraggingKeypad = true;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                startX = clientX - currentX;
                startY = clientY - currentY;
            }

            function onKeypadDrag(e) {
                if (!isDraggingKeypad) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                currentX = clientX - startX;
                currentY = clientY - startY;
                keypadDiv.style.transform = `translate(${currentX}px, ${currentY}px)`;
            }

            function stopKeypadDrag() {
                isDraggingKeypad = false;
            }

            const keys = [
                '⬆ Up', '⬇ Down', '🗑 Del', '⌫',
                '7', '8', '9', '/',
                '4', '5', '6', 'x',
                '1', '2', '3', '-',
                '0', '.', '%', '+',
                '⌨ Keyboard', 'Enter', 'Enter+Open'
            ];

            keys.forEach(k => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'mini-key-btn';
                if (['+', '-', 'x', 'X', '*', '/', '%'].includes(k)) btn.classList.add('op');
                if (k === '⌫') btn.classList.add('backspace');
                if (k === '⌨ Keyboard') {
                    btn.classList.add('kbd-key');
                    btn.style.gridColumn = 'span 1';
                }
                if (k === '⬆ Up' || k === '⬇ Down') btn.classList.add('nav-key');
                if (k === '🗑 Del') btn.classList.add('clear-key');
                if (k === 'Enter') {
                    btn.classList.add('enter-key');
                    btn.style.gridColumn = 'span 1';
                }
                if (k === 'Enter+Open') {
                    btn.classList.add('enter-open-key');
                    btn.style.gridColumn = 'span 2';
                }

                if (k === 'Enter') btn.innerText = 'Enter ↵';
                else if (k === 'Enter+Open') btn.innerText = 'Enter + Open 🚀';
                else btn.innerText = k;
                
                btn.addEventListener('click', () => {
                    if (k === '⌫') {
                        handleBackspaceForField(index, field);
                    } else if (k === '⌨ Keyboard') {
                        openSystemKeyboard(index, field);
                    } else if (k === '⬆ Up') {
                        goToFirstRow();
                    } else if (k === '⬇ Down') {
                        goToLastRow();
                    } else if (k === '🗑 Del') {
                        clearCurrentField();
                    } else if (k === 'Enter') {
                        addNewRowFromPad(index, field);
                    } else if (k === 'Enter+Open') {
                        addNewRowAndOpenTool(index, field);
                    } else {
                        insertValueForField(index, field, k);
                    }
                });
                keypadDiv.appendChild(btn);
            });

            return keypadDiv;
        }

        function setupCellGestures(element, index, field) {
            let lastTapTime = 0;
            let longPressTimer = null;
            let isLongPressFired = false;
            let clickCount = 0;
            let clickTimer = null;

            if (isMobileAny) {
                element.setAttribute('readonly', 'true');
                element.setAttribute('inputmode', 'none');

                element.addEventListener('touchstart', (e) => {
                    isLongPressFired = false;
                    activeRowIndex = index;
                    activeFieldIndex = field;
                    updateActiveRowClasses();
                    updateMobilePreviewText();

                    longPressTimer = setTimeout(() => {
                        isLongPressFired = true;
                        openSystemKeyboard(index, field);
                    }, 400);

                }, { passive: true });

                element.addEventListener('touchend', (e) => {
                    clearTimeout(longPressTimer);
                    if (isLongPressFired) return;

                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTapTime;

                    if (tapLength < 350 && tapLength > 0) {
                        e.preventDefault();
                        if (isMobileAny) {
                            element.setAttribute('readonly', 'true');
                            element.setAttribute('inputmode', 'none');
                        }
                        openCalcPadForField(index, field);
                        lastTapTime = 0;
                    } else {
                        lastTapTime = currentTime;
                    }
                });

                element.addEventListener('touchmove', () => {
                    clearTimeout(longPressTimer);
                });
            } else {
                element.addEventListener('mousedown', (e) => {
                    activeRowIndex = index;
                    activeFieldIndex = field;
                    updateActiveRowClasses();
                    updateMobilePreviewText();

                    clickCount++;
                    if (clickCount === 1) {
                        clickTimer = setTimeout(() => {
                            clickCount = 0;
                        }, 400);
                    } else if (clickCount === 3) {
                        clearTimeout(clickTimer);
                        clickCount = 0;
                        e.preventDefault();
                        openCalcPadForField(index, field);
                    }
                });
            }

            element.addEventListener('dblclick', (e) => {
                e.preventDefault();
                if (isMobileAny) {
                    openCalcPadForField(index, field);
                }
            });
        }

        // إيماءة السحب (Swipe) يميناً أو يساراً لحذف السطر
        function setupRowSwipeToDelete(rowDiv, index) {
            let startX = 0;
            let currentX = 0;
            let isSwiping = false;

            rowDiv.addEventListener('touchstart', (e) => {
                if (e.target.closest('button') || e.target.closest('textarea') || e.target.closest('input')) return;
                startX = e.touches[0].clientX;
                isSwiping = true;
            }, { passive: true });

            rowDiv.addEventListener('touchmove', (e) => {
                if (!isSwiping) return;
                currentX = e.touches[0].clientX;
                let diffX = currentX - startX;
                
                if (Math.abs(diffX) > 10) {
                    rowDiv.style.transform = `translateX(${diffX}px)`;
                    rowDiv.style.opacity = `${1 - Math.abs(diffX) / 300}`;
                }
            }, { passive: true });

            rowDiv.addEventListener('touchend', (e) => {
                if (!isSwiping) return;
                isSwiping = false;
                let diffX = currentX - startX;

                if (Math.abs(diffX) > 100) {
                    rowDiv.style.transition = 'all 0.25s ease';
                    rowDiv.style.transform = diffX > 0 ? 'translateX(100vw)' : 'translateX(-100vw)';
                    rowDiv.style.opacity = '0';
                    setTimeout(() => {
                        deleteRow(index);
                    }, 250);
                } else {
                    rowDiv.style.transition = 'transform 0.15s ease, opacity 0.15s ease';
                    rowDiv.style.transform = 'translateX(0px)';
                    rowDiv.style.opacity = '1';
                }
            });
        }
