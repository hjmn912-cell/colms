<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>آلة حاسبة الأسطر المتعددة</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .calculator-container {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            background-color: #111827;
            border-radius: 0;
            box-shadow: none;
            border: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }

        .sticky-top-section {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #030712;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            flex-shrink: 0;
        }

        .top-controls-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #1f2937;
            gap: 8px;
            position: relative;
            flex-wrap: wrap;
        }

        .left-controls-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .options-dropdown {
            position: relative;
            display: inline-block;
        }

        .options-btn, .refresh-btn {
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .refresh-btn {
            padding: 6px 10px;
            font-size: 1rem;
        }

        .options-btn:hover, .refresh-btn:hover {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .options-dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 110%;
            background-color: #1e293b;
            min-width: 170px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.5);
            border-radius: 6px;
            z-index: 2000;
            border: 1px solid #38bdf8;
            padding: 8px 10px;
            flex-direction: column;
            gap: 8px;
        }

        .options-dropdown-content.active {
            display: flex;
        }

        .option-toggle-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            font-size: 0.9rem;
            color: #f8fafc;
            white-space: nowrap;
        }

        .option-toggle-label input {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #38bdf8;
        }

        .totals-summary-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            flex: 1;
        }

        .sub-totals-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 1.1rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .summary-item input[type="checkbox"] {
            width: 15px;
            height: 15px;
            cursor: pointer;
            accent-color: #38bdf8;
        }

        .positive-sum {
            color: #10b981;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .negative-sum {
            color: #ef4444;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .calculator-header {
            background-color: #030712;
            padding: 8px 12px;
            border-bottom: 2px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 8px;
            position: relative;
        }

        .total-value-container {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 6px;
            flex: 2;
            white-space: nowrap;
            overflow: visible;
        }

        .total-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #38bdf8;
            white-space: nowrap;
        }

        .total-currency {
            font-size: 1rem;
            color: #38bdf8;
            font-weight: 600;
            white-space: nowrap;
        }

        .total-value.negative {
            color: #ef4444 !important;
        }

        .header-right-group {
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: flex-end;
        }

        .designer-credit {
            font-size: 0.7rem;
            color: #6b7280;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .top-action-btn, .top-notes-focus-btn, .toggle-hide-btn {
            background-color: #1e293b;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .top-action-btn, .top-notes-focus-btn {
            display: none;
        }

        .toggle-hide-btn:hover {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .toggle-hide-btn.active-mode {
            background-color: #eab308;
            color: #000;
            border-color: #facc15;
            box-shadow: 0 0 8px rgba(234, 179, 8, 0.6);
        }

        .export-dropdown {
            position: relative;
            display: inline-block;
            text-align: left;
        }

        .export-btn {
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .export-btn:hover {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            left: 0;
            background-color: #1e293b;
            min-width: 220px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.5);
            border-radius: 6px;
            z-index: 2000;
            border: 1px solid #38bdf8;
            overflow: hidden;
        }

        .dropdown-content button {
            color: #f8fafc;
            padding: 8px 12px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            text-align: right;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            border-bottom: 1px solid #334155;
        }

        .dropdown-content button:last-child {
            border-bottom: none;
        }

        .dropdown-content button:hover {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .dropdown-divider {
            height: 1px;
            background-color: #38bdf8;
            margin: 2px 0;
        }

        .export-dropdown.active .dropdown-content {
            display: block;
        }

        .calculator-screen {
            background-color: #0f172a;
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden;
            gap: 8px;
            width: 100%;
            padding-bottom: 250px;
            -webkit-overflow-scrolling: touch;
        }

        .calc-row {
            display: flex;
            flex-direction: column;
            background-color: #1e293b;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid transparent;
            transition: border-color 0.2s;
            gap: 8px;
            width: 100%;
            min-width: 0 !important;
        }

        .calc-row.active {
            border-color: #38bdf8;
            background-color: #1e293b;
        }

        .calc-row-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .inputs-group {
            display: flex;
            gap: 8px;
            flex-grow: 1;
            align-items: center;
            width: 100%;
            min-width: 0;
        }

        .text-input-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 2; 
            min-width: 0;
        }

        .calc-input-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1; 
            min-width: 0;
        }

        .mic-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .global-select-checkbox, .calc-select-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #eab308;
            flex-shrink: 0;
        }

        .row-mobile-arrow-btn, .row-calc-arrow-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            font-size: 0.85rem;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .row-mobile-arrow-btn:active, .row-calc-arrow-btn:active {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .row-keypad-container {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            position: fixed;
            bottom: 25px;
            left: 0;
            padding: 0 10px;
            z-index: 9999;
            pointer-events: none;
        }

        .row-mini-keypad {
            pointer-events: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background-color: #030712;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #38bdf8;
            width: 100%;
            max-width: 100%;
            direction: ltr;
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.95);
            touch-action: none;
            cursor: grab;
            user-select: none;
        }

        .row-mini-keypad:active {
            cursor: grabbing;
        }

        .keypad-header {
            grid-column: span 4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
            background-color: #1e293b;
            padding: 6px 10px;
            border-radius: 6px;
        }

        .keypad-drag-title {
            color: #38bdf8;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .close-keypad-btn {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        .close-keypad-btn:hover {
            background-color: #ef4444;
            color: #fff;
        }

        .mini-key-btn {
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 14px 6px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            transition: all 0.2s;
            user-select: none;
        }

        .mini-key-btn:hover {
            background-color: #38bdf8;
            color: #0b0f19;
            border-color: #38bdf8;
        }

        .mini-key-btn.op {
            background-color: #0f172a;
            color: #38bdf8;
            border-color: #38bdf8;
        }

        .mini-key-btn.backspace {
            background-color: #331f29;
            color: #ef4444;
            border-color: #ef4444;
        }

        .mini-key-btn.backspace:hover {
            background-color: #ef4444;
            color: #fff;
        }

        .mini-key-btn.enter-key {
            background-color: #065f46;
            color: #34d399;
            border-color: #059669;
            font-size: 1.05rem;
        }

        .mini-key-btn.enter-key:hover {
            background-color: #10b981;
            color: #ffffff;
        }

        .mini-key-btn.enter-open-key {
            background-color: #1e1b4b;
            color: #a78bfa;
            border-color: #8b5cf6;
            font-size: 1.05rem;
        }

        .mini-key-btn.enter-open-key:hover {
            background-color: #8b5cf6;
            color: #ffffff;
        }

        .mini-key-btn.kbd-key {
            background-color: #1e1b4b;
            color: #818cf8;
            border-color: #6366f1;
            font-size: 0.95rem;
        }

        .mini-key-btn.kbd-key:hover {
            background-color: #6366f1;
            color: #ffffff;
        }

        .mini-key-btn.nav-key {
            background-color: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            font-size: 1.05rem;
        }

        .mini-key-btn.nav-key:hover {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .mini-key-btn.clear-key {
            background-color: #7f1d1d;
            color: #fca5a5;
            border-color: #ef4444;
            font-size: 1.05rem;
        }

        .mini-key-btn.clear-key:hover {
            background-color: #ef4444;
            color: #ffffff;
        }

        .text-input, .calc-input {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid #334155;
            border-radius: 6px;
            padding: 6px 8px;
            color: #38bdf8;
            font-size: 1.3rem;
            font-weight: bold;
            outline: none;
            font-family: inherit;
            width: 100%;
            transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
        }

        .text-input {
            flex: 1;
            resize: none;
            overflow-y: hidden;
            min-height: 38px;
            line-height: 1.2;
        }

        .calc-input {
            width: 100%;
            height: 38px;
            direction: ltr;
            text-align: right;
            font-size: 1.4rem;
        }

        .text-border-active, .calc-border-active {
            border-color: #38bdf8 !important;
            background: rgba(56, 189, 248, 0.1) !important;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4) !important;
        }

        .calc-row.hidden-calc .calc-input {
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .calc-row.hidden-text .text-input {
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .calc-row.hidden-mic .mic-btn {
            display: none !important;
        }

        .calc-output-container {
            display: flex;
            align-items: baseline;
            gap: 4px;
            min-width: 90px;
            text-align: left;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .calc-output {
            font-size: 1.3rem;
            font-weight: 700;
            color: #10b981;
            white-space: nowrap;
        }

        .row-currency {
            font-size: 1rem;
            color: #38bdf8;
            font-weight: 600;
            white-space: nowrap;
        }

        .calc-output.negative {
            color: #ef4444 !important;
        }

        .mic-btn, .delete-row-btn {
            background: transparent;
            border: none;
            color: #6b7280;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 6px;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .mic-btn:hover {
            background-color: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
        }

        .mic-btn.listening {
            color: #ef4444 !important;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .delete-row-btn:hover {
            background-color: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .keyboard-hint {
            padding: 6px 10px;
            text-align: center;
            font-size: 0.75rem;
            color: #6b7280;
            background-color: #111827;
            border-top: 1px solid #1f2937;
            width: 100%;
            flex-shrink: 0;
        }

        .keyboard-hint span {
            color: #38bdf8;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .calculator-header {
                flex-direction: column;
                gap: 4px;
                padding: 6px;
            }
            .total-value-container {
                width: 100%;
                justify-content: center;
            }
            .total-value {
                font-size: 1.5rem;
            }
            .header-right-group {
                width: 100%;
                justify-content: space-between;
            }
            .calc-output-container {
                min-width: 70px;
            }
            .text-input, .calc-input, .calc-output {
                font-size: 1.15rem;
                height: 36px;
                min-height: 36px;
            }
        }
    </style>
</head>
<body>

    <div class="calculator-container" id="calculatorContainer">
        
        <div class="sticky-top-section">
            <div class="top-controls-wrapper">
                <div class="left-controls-group">
                    <!-- الخيارات -->
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <input type="checkbox" id="hideOptionsCheckbox" class="global-select-checkbox" style="display:none;" onchange="updateGlobalHides()">
                        <div class="options-dropdown" id="optionsDropdown">
                            <button class="options-btn" type="button" onclick="toggleOptionsMenu(event)">
                                الخيارات <span>▼</span>
                            </button>
                            <div class="options-dropdown-content" id="optionsDropdownContent">
                                <label class="option-toggle-label">
                                    <input type="checkbox" id="showCurrencyCheckbox" checked onchange="renderCalculator()">
                                    إظهار كلمة جنيه
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- زر إعادة التحميل -->
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <input type="checkbox" id="hideRefreshCheckbox" class="global-select-checkbox" style="display:none;" onchange="updateGlobalHides()">
                        <button class="refresh-btn" id="refreshBtnEl" type="button" title="إعادة تحميل الصفحة" onclick="location.reload()">
                            🔄
                        </button>
                    </div>
                </div>

                <div class="totals-summary-bar">
                    <div class="sub-totals-row">
                        <!-- مجموع العمليات الموجبة -->
                        <div style="display: flex; align-items: center; gap: 4px;">
                            <input type="checkbox" id="hidePositiveCheckbox" class="global-select-checkbox" style="display:none;" onchange="updateGlobalHides()">
                            <div class="summary-item">
                                <input type="checkbox" id="showPositiveCheckbox" onchange="renderCalculator()">
                                <span id="positiveTotalVal" class="positive-sum"></span>
                            </div>
                        </div>

                        <!-- مجموع العمليات السالبة -->
                        <div style="display: flex; align-items: center; gap: 4px;">
                            <input type="checkbox" id="hideNegativeCheckbox" class="global-select-checkbox" style="display:none;" onchange="updateGlobalHides()">
                            <div class="summary-item">
                                <input type="checkbox" id="showNegativeCheckbox" onchange="renderCalculator()">
                                <span id="negativeTotalVal" class="negative-sum"></span>
                            </div>
                        </div>
                    </div>

                    <div class="total-value-container">
                        <!-- الإجمالي النهائي -->
                        <div style="display: flex; align-items: center; gap: 4px;">
                            <input type="checkbox" id="hideGrandTotalCheckbox" class="global-select-checkbox" style="display:none;" onchange="updateGlobalHides()">
                            <div id="grandTotal" class="total-value">0</div>
                        </div>
                        <!-- كلمة جنيه المجاورة للإجمالي النهائي -->
                        <div style="display: flex; align-items: center; gap: 4px;">
                            <input type="checkbox" id="hideGrandCurrencyCheckbox" class="global-select-checkbox" style="display:none;" onchange="updateGlobalHides()">
                            <div id="grandTotalCurrency" class="total-currency">جنيه</div>
                        </div>
                    </div>
                </div>

                <div style="width: 60px;"></div>
            </div>

            <div class="calculator-header">
                <div class="header-right-group">
                    <button type="button" id="topNotesFocusBtn" class="top-notes-focus-btn" title="النزول للسطر التالي أو إنشاء جديد في الملاحظات" onclick="handleTopNotesFocusClick()">📝</button>
                    <button type="button" id="topActionBtn" class="top-action-btn" title="النزول للسطر التالي أو إنشاء جديد في العملية الحسابية" onclick="handleTopActionBtnClick()">📄</button>
                    
                    <span class="designer-credit">designed by Sami Arouj</span>
                    
                    <!-- زر إخفاء/إظهار الشامل -->
                    <button type="button" id="toggleHideBtn" class="toggle-hide-btn" title="تحديد العناصر المراد إخفاؤها" onclick="toggleHideSelectionMode()">
                        👁️
                    </button>

                    <!-- زر التصدير ومشاركة -->
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <input type="checkbox" id="hideExportCheckbox" class="global-select-checkbox" style="display:none;" onchange="updateGlobalHides()">
                        <div class="export-dropdown" id="exportDropdown">
                            <button class="export-btn" onclick="toggleExportMenu(event)">
                                تصدير ومشاركة <span>▼</span>
                            </button>
                            <div class="dropdown-content">
                                <button onclick="exportToExcel()">📊 إكسيل (Excel)</button>
                                <button onclick="exportToWord()">📝 وورد (Word)</button>
                                <button onclick="exportToPDF()">📄 بي دي إف (PDF)</button>
                                <button onclick="exportToTXT()">📄 تصدير ملف نصي (TXT)</button>
                                <button onclick="exportToImage()">🖼️ تنزيل صورة</button>
                                
                                <div class="dropdown-divider"></div>
                                
                                <button onclick="openPhoneWhatsApp()">📱 فتح واتساب الهاتف</button>
                                <button onclick="openPhoneMessenger()">💬 فتح ماسنجر الهاتف</button>
                                <button onclick="copyReportTextOnly()">📋 نسخ التقرير نصياً</button>

                                <div class="dropdown-divider"></div>

                                <button onclick="shareLinkToWhatsApp()">💬 إرسال التقرير للواتساب</button>
                                <button onclick="shareLinkToMessenger()">⚡ إرسال التقرير للماسنجر</button>
                                <button onclick="shareLinkToSMS()">📱 إرسال التقرير عبر رسالة نصية (SMS)</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="screenContainer" class="calculator-screen"></div>

        <div class="keyboard-hint">
            <span>الأسهم</span> للتحرك بين الأسطر والحقول | <span>Home</span> للحساب بالقوة | <span>Page Up</span> لتجاهل ما قبل المؤشر | <span>Enter</span> للسطر التالي أو جديد
        </div>
    </div>

    <script>
        const screenContainer = document.getElementById('screenContainer');
        const grandTotalEl = document.getElementById('grandTotal');
        const grandTotalCurrencyEl = document.getElementById('grandTotalCurrency');
        const showCurrencyCheckbox = document.getElementById('showCurrencyCheckbox');
        const showPositiveCheckbox = document.getElementById('showPositiveCheckbox');
        const showNegativeCheckbox = document.getElementById('showNegativeCheckbox');
        const positiveTotalValEl = document.getElementById('positiveTotalVal');
        const negativeTotalValEl = document.getElementById('negativeTotalVal');
        const calculatorContainer = document.getElementById('calculatorContainer');
        const topActionBtn = document.getElementById('topActionBtn');
        const topNotesFocusBtn = document.getElementById('topNotesFocusBtn');
        const toggleHideBtn = document.getElementById('toggleHideBtn');

        const optionsDropdownEl = document.getElementById('optionsDropdown');
        const refreshBtnEl = document.getElementById('refreshBtnEl');
        const exportDropdownEl = document.getElementById('exportDropdown');

        let isSelectionModeActive = false;

        function isMobileDevice() {
            const hasTouchScreen = (('maxTouchPoints' in navigator && navigator.maxTouchPoints > 0) || ('msMaxTouchPoints' in navigator && navigator.msMaxTouchPoints > 0));
            const isUserAgentMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const isSmallScreen = window.innerWidth <= 1024;
            return isUserAgentMobile || (hasTouchScreen && isSmallScreen);
        }

        const isMobile = isMobileDevice();

        if (isMobile) {
            topActionBtn.style.display = 'inline-flex';
            topNotesFocusBtn.style.display = 'inline-flex';
        }

        let rows = [
            { 
                textExpression: '', 
                expression: '', 
                result: 0, 
                forceCalc: false, 
                ignoreBeforeIndex: 0, 
                isCalcVisible: true, 
                isTextVisible: true,
                isMicVisible: true,
                isCalcPadVisible: false, 
                isTextPadVisible: false
            }
        ];
        let activeRowIndex = 0;
        let activeFieldIndex = 'calc';

        function toggleHideSelectionMode() {
            isSelectionModeActive = !isSelectionModeActive;
            
            const checkboxes = document.querySelectorAll('.global-select-checkbox');
            checkboxes.forEach(cb => {
                cb.style.display = isSelectionModeActive ? 'inline-block' : 'none';
            });

            if (isSelectionModeActive) {
                toggleHideBtn.classList.add('active-mode');
            } else {
                toggleHideBtn.classList.remove('active-mode');
            }
            
            renderCalculator();
        }

        function updateGlobalHides() {
            optionsDropdownEl.style.display = document.getElementById('hideOptionsCheckbox').checked ? 'none' : 'inline-block';
            refreshBtnEl.style.display = document.getElementById('hideRefreshCheckbox').checked ? 'none' : 'inline-flex';
            exportDropdownEl.style.display = document.getElementById('hideExportCheckbox').checked ? 'none' : 'inline-block';
            
            document.getElementById('positiveTotalVal').parentElement.parentElement.style.display = document.getElementById('hidePositiveCheckbox').checked ? 'none' : 'flex';
            document.getElementById('negativeTotalVal').parentElement.parentElement.style.display = document.getElementById('hideNegativeCheckbox').checked ? 'none' : 'flex';
            
            grandTotalEl.style.display = document.getElementById('hideGrandTotalCheckbox').checked ? 'none' : 'block';
            grandTotalCurrencyEl.style.display = document.getElementById('hideGrandCurrencyCheckbox').checked ? 'none' : 'block';
        }

        function closeAllPads() {
            rows.forEach(r => {
                r.isCalcPadVisible = false;
                r.isTextPadVisible = false;
            });
        }

        function handleTopActionBtnClick() {
            evaluateRow(activeRowIndex);
            closeAllPads();

            if (activeRowIndex < rows.length - 1) {
                activeRowIndex++;
                activeFieldIndex = 'calc';
                renderCalculator('calc');
                scrollToActiveRow();
            } else {
                rows.push({ 
                    textExpression: '', expression: '', result: 0, forceCalc: false, ignoreBeforeIndex: 0, 
                    isCalcVisible: true, isTextVisible: true, isMicVisible: true, isCalcPadVisible: false, isTextPadVisible: false
                });
                activeRowIndex = rows.length - 1;
                activeFieldIndex = 'calc';
                renderCalculator('calc');
                screenContainer.scrollTop = screenContainer.scrollHeight;
            }
        }

        function handleTopNotesFocusClick() {
            evaluateRow(activeRowIndex);
            closeAllPads();

            if (activeRowIndex < rows.length - 1) {
                activeRowIndex++;
                activeFieldIndex = 'text';
                renderCalculator('text');
                scrollToActiveRow();
            } else {
                rows.push({ 
                    textExpression: '', expression: '', result: 0, forceCalc: false, ignoreBeforeIndex: 0, 
                    isCalcVisible: true, isTextVisible: true, isMicVisible: true, isCalcPadVisible: false, isTextPadVisible: false
                });
                activeRowIndex = rows.length - 1;
                activeFieldIndex = 'text';
                renderCalculator('text');
                screenContainer.scrollTop = screenContainer.scrollHeight;
            }
        }

        function goToFirstRow() {
            if (rows.length > 0) {
                activeRowIndex = 0;
                renderCalculator(activeFieldIndex);
                scrollToActiveRow();
            }
        }

        function goToLastRow() {
            if (rows.length > 0) {
                activeRowIndex = rows.length - 1;
                renderCalculator(activeFieldIndex);
                scrollToActiveRow();
            }
        }

        function clearCurrentField() {
            if (rows[activeRowIndex]) {
                if (activeFieldIndex === 'text') {
                    rows[activeRowIndex].textExpression = '';
                } else {
                    rows[activeRowIndex].expression = '';
                    rows[activeRowIndex].result = 0;
                    rows[activeRowIndex].forceCalc = false;
                    rows[activeRowIndex].ignoreBeforeIndex = 0;
                }
                renderCalculator(activeFieldIndex);
            }
        }

        function scrollToActiveRow() {
            const activeRowEl = screenContainer.children[activeRowIndex];
            if (activeRowEl) {
                activeRowEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function toggleOptionsMenu(e) {
            e.stopPropagation();
            const dropdown = document.getElementById('optionsDropdownContent');
            const exportDropdown = document.querySelector('#exportDropdown .dropdown-content');
            if (exportDropdown) exportDropdown.parentElement.classList.remove('active');
            dropdown.classList.toggle('active');
        }

        function toggleExportMenu(e) {
            e.stopPropagation();
            const dropdown = document.getElementById('exportDropdown');
            const optionsDropdown = document.getElementById('optionsDropdownContent');
            if (optionsDropdown) optionsDropdown.classList.remove('active');
            dropdown.classList.toggle('active');
        }

        window.addEventListener('click', (e) => {
            const optionsDropdown = document.getElementById('optionsDropdownContent');
            const exportDropdown = document.getElementById('exportDropdown');
            
            if (optionsDropdown && !optionsDropdown.contains(e.target) && !e.target.closest('.options-btn')) {
                optionsDropdown.classList.remove('active');
            }
            if (exportDropdown && !exportDropdown.contains(e.target)) {
                exportDropdown.classList.remove('active');
            }
        });

        function insertValueForField(index, field, val) {
            activeRowIndex = index;
            activeFieldIndex = field;
            if (field === 'text') {
                rows[index].textExpression += val;
                renderCalculator('text');
            } else {
                rows[index].expression += val;
                rows[index].forceCalc = false;
                evaluateRow(index);
                renderCalculator('calc');
            }
        }

        function handleBackspaceForField(index, field) {
            activeRowIndex = index;
            activeFieldIndex = field;
            if (field === 'text') {
                let text = rows[index].textExpression;
                if (text.length > 0) {
                    rows[index].textExpression = text.substring(0, text.length - 1);
                    renderCalculator('text');
                }
            } else {
                let expr = rows[index].expression;
                if (expr.length > 0) {
                    rows[index].expression = expr.substring(0, expr.length - 1);
                    rows[index].forceCalc = false;
                    evaluateRow(index);
                    renderCalculator('calc');
                }
            }
        }

        function openSystemKeyboard(index, field) {
            activeRowIndex = index;
            activeFieldIndex = field;
            closeAllPads(); 
            renderCalculator(field);

            setTimeout(() => {
                const activeEl = screenContainer.querySelector(`.calc-row.active .${field === 'text' ? 'text-input' : 'calc-input'}`);
                if (activeEl) {
                    activeEl.removeAttribute('readonly');
                    activeEl.removeAttribute('inputmode');
                    activeEl.focus();
                }
            }, 30);
        }

        function openCalcPadForField(index, field) {
            activeRowIndex = index;
            activeFieldIndex = field;
            closeAllPads();

            if (field === 'text') {
                rows[index].isTextPadVisible = true;
            } else {
                rows[index].isCalcPadVisible = true;
            }
            renderCalculator(field);
        }

        function addNewRowFromPad(index, field) {
            evaluateRow(index);
            closeAllPads();

            if (index < rows.length - 1) {
                activeRowIndex = index + 1;
                activeFieldIndex = field;
                renderCalculator(field);
                scrollToActiveRow();
            } else {
                rows.push({ 
                    textExpression: '', expression: '', result: 0, forceCalc: false, ignoreBeforeIndex: 0, 
                    isCalcVisible: true, isTextVisible: true, isMicVisible: true, isCalcPadVisible: false, isTextPadVisible: false
                });
                activeRowIndex = rows.length - 1;
                activeFieldIndex = field;
                renderCalculator(field);
                screenContainer.scrollTop = screenContainer.scrollHeight;
            }
        }

        function addNewRowAndOpenTool(index, field) {
            evaluateRow(index);
            closeAllPads();

            let targetIndex;
            if (index < rows.length - 1) {
                targetIndex = index + 1;
            } else {
                rows.push({ 
                    textExpression: '', expression: '', result: 0, forceCalc: false, ignoreBeforeIndex: 0, 
                    isCalcVisible: true, isTextVisible: true, isMicVisible: true, isCalcPadVisible: false, isTextPadVisible: false
                });
                targetIndex = rows.length - 1;
            }

            activeRowIndex = targetIndex;
            activeFieldIndex = field;

            if (field === 'text') {
                renderCalculator(field);
                setTimeout(() => {
                    const activeText = screenContainer.querySelector('.calc-row.active .text-input');
                    if (activeText) {
                        activeText.removeAttribute('readonly');
                        activeText.removeAttribute('inputmode');
                        activeText.focus();
                    }
                }, 30);
            } else {
                rows[targetIndex].isCalcPadVisible = true;
                renderCalculator(field);
            }

            scrollToActiveRow();
        }

        function formatDisplayValue(val) {
            if (typeof val === 'number') {
                if (val < 0) {
                    return { text: `(${Math.abs(val)})`, isNegative: true };
                }
                return { text: `${val}`, isNegative: false };
            }
            return { text: val, isNegative: false };
        }

        function createMiniKeypad(index, field) {
            const keypadDiv = document.createElement('div');
            keypadDiv.className = 'row-mini-keypad';
            
            const headerDiv = document.createElement('div');
            headerDiv.className = 'keypad-header';
            
            const titleSpan = document.createElement('span');
            titleSpan.className = 'keypad-drag-title';
            titleSpan.innerHTML = '☰ لوحة المفاتيح والآلة الحاسبة (اسحب للتحريك)';
            headerDiv.appendChild(titleSpan);

            const closeBtn = document.createElement('button');
            closeBtn.type = 'button';
            closeBtn.className = 'close-keypad-btn';
            closeBtn.innerText = 'إخفاء ✕';
            closeBtn.title = 'إخفاء الآلة الحاسبة';
            closeBtn.addEventListener('click', () => {
                if (field === 'text') {
                    rows[index].isTextPadVisible = false;
                } else {
                    rows[index].isCalcPadVisible = false;
                }
                renderCalculator(field);
            });
            headerDiv.appendChild(closeBtn);
            keypadDiv.appendChild(headerDiv);

            let isDraggingKeypad = false;
            let startX = 0, startY = 0;
            let currentX = 0, currentY = 0;

            keypadDiv.addEventListener('mousedown', startKeypadDrag);
            window.addEventListener('mousemove', onKeypadDrag);
            window.addEventListener('mouseup', stopKeypadDrag);

            keypadDiv.addEventListener('touchstart', startKeypadDrag, { passive: true });
            window.addEventListener('touchmove', onKeypadDrag, { passive: true });
            window.addEventListener('touchend', stopKeypadDrag);

            function startKeypadDrag(e) {
                if (e.target.closest('button')) return;
                isDraggingKeypad = true;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                startX = clientX - currentX;
                startY = clientY - currentY;
            }

            function onKeypadDrag(e) {
                if (!isDraggingKeypad) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                currentX = clientX - startX;
                currentY = clientY - startY;
                keypadDiv.style.transform = `translate(${currentX}px, ${currentY}px)`;
            }

            function stopKeypadDrag() {
                isDraggingKeypad = false;
            }

            const keys = [
                '⬆ Up', '⬇ Down', '🗑 Del', '⌫',
                '7', '8', '9', '/',
                '4', '5', '6', '*',
                '1', '2', '3', '-',
                '0', '.', '%', '+',
                '⌨ Keyboard', 'Enter', 'Enter+Open'
            ];

            keys.forEach(k => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'mini-key-btn';
                if (['+', '-', '*', '/', '%'].includes(k)) btn.classList.add('op');
                if (k === '⌫') btn.classList.add('backspace');
                if (k === '⌨ Keyboard') {
                    btn.classList.add('kbd-key');
                    btn.style.gridColumn = 'span 1';
                }
                if (k === '⬆ Up' || k === '⬇ Down') btn.classList.add('nav-key');
                if (k === '🗑 Del') btn.classList.add('clear-key');
                if (k === 'Enter') {
                    btn.classList.add('enter-key');
                    btn.style.gridColumn = 'span 1';
                }
                if (k === 'Enter+Open') {
                    btn.classList.add('enter-open-key');
                    btn.style.gridColumn = 'span 2';
                }

                if (k === 'Enter') btn.innerText = 'Enter ↵';
                else if (k === 'Enter+Open') btn.innerText = 'Enter + Open 🚀';
                else btn.innerText = k;
                
                btn.addEventListener('click', () => {
                    if (k === '⌫') {
                        handleBackspaceForField(index, field);
                    } else if (k === '⌨ Keyboard') {
                        openSystemKeyboard(index, field);
                    } else if (k === '⬆ Up') {
                        goToFirstRow();
                    } else if (k === '⬇ Down') {
                        goToLastRow();
                    } else if (k === '🗑 Del') {
                        clearCurrentField();
                    } else if (k === 'Enter') {
                        addNewRowFromPad(index, field);
                    } else if (k === 'Enter+Open') {
                        addNewRowAndOpenTool(index, field);
                    } else {
                        insertValueForField(index, field, k);
                    }
                });
                keypadDiv.appendChild(btn);
            });

            return keypadDiv;
        }

        function setupCellGestures(element, index, field) {
            let lastTapTime = 0;
            let longPressTimer = null;
            let isLongPressFired = false;

            if (isMobile) {
                element.setAttribute('readonly', 'true');
                element.setAttribute('inputmode', 'none');
            }

            element.addEventListener('touchstart', (e) => {
                isLongPressFired = false;
                activeRowIndex = index;
                activeFieldIndex = field;
                updateActiveRowClasses();

                longPressTimer = setTimeout(() => {
                    isLongPressFired = true;
                    openSystemKeyboard(index, field);
                }, 400);

            }, { passive: true });

            element.addEventListener('touchend', (e) => {
                clearTimeout(longPressTimer);
                if (isLongPressFired) return;

                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;

                if (tapLength < 350 && tapLength > 0) {
                    e.preventDefault();
                    if (isMobile) {
                        element.setAttribute('readonly', 'true');
                        element.setAttribute('inputmode', 'none');
                    }
                    openCalcPadForField(index, field);
                    lastTapTime = 0;
                } else {
                    lastTapTime = currentTime;
                }
            });

            element.addEventListener('touchmove', () => {
                clearTimeout(longPressTimer);
            });

            element.addEventListener('mousedown', (e) => {
                activeRowIndex = index;
                activeFieldIndex = field;
                updateActiveRowClasses();
            });

            element.addEventListener('dblclick', (e) => {
                e.preventDefault();
                openCalcPadForField(index, field);
            });
        }

        function renderCalculator(focusTarget = null) {
            screenContainer.innerHTML = '';
            let totalSum = 0;
            let positiveSum = 0;
            let negativeSum = 0;
            const showCurrency = showCurrencyCheckbox.checked;

            rows.forEach((row, index) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = `calc-row ${index === activeRowIndex ? 'active' : ''} ${!row.isCalcVisible ? 'hidden-calc' : ''} ${!row.isTextVisible ? 'hidden-text' : ''} ${!row.isMicVisible ? 'hidden-mic' : ''}`;

                const rowMain = document.createElement('div');
                rowMain.className = 'calc-row-main';

                const inputsGroup = document.createElement('div');
                inputsGroup.className = 'inputs-group';

                const textWrapper = document.createElement('div');
                textWrapper.className = 'text-input-wrapper';

                if (isSelectionModeActive) {
                    const selectTextCheckbox = document.createElement('input');
                    selectTextCheckbox.type = 'checkbox';
                    selectTextCheckbox.className = 'calc-select-checkbox';
                    selectTextCheckbox.checked = !row.isTextVisible;
                    selectTextCheckbox.title = 'علم هنا لإخفاء ملاحظات هذا السطر';
                    
                    selectTextCheckbox.addEventListener('change', (e) => {
                        row.isTextVisible = !e.target.checked;
                    });
                    
                    textWrapper.appendChild(selectTextCheckbox);
                }

                const mobileArrowBtn = document.createElement('button');
                mobileArrowBtn.type = 'button';
                mobileArrowBtn.className = 'row-mobile-arrow-btn';
                mobileArrowBtn.innerHTML = '🔽';
                mobileArrowBtn.title = 'التنقل لأسفل أو إضافة سطر جديد';
                
                if (isMobile) {
                    mobileArrowBtn.style.display = 'flex';
                }

                mobileArrowBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (index < rows.length - 1) {
                        activeRowIndex = index + 1;
                        activeFieldIndex = 'text';
                        renderCalculator('text');
                        scrollToActiveRow();
                    } else {
                        evaluateRow(index);
                        closeAllPads();
                        rows.push({ 
                            textExpression: '', expression: '', result: 0, forceCalc: false, ignoreBeforeIndex: 0, 
                            isCalcVisible: true, isTextVisible: true, isMicVisible: true, isCalcPadVisible: false, isTextPadVisible: false
                        });
                        activeRowIndex = rows.length - 1;
                        activeFieldIndex = 'text';
                        renderCalculator('text');
                        screenContainer.scrollTop = screenContainer.scrollHeight;
                    }
                });

                const mobileKbdArrowBtn = document.createElement('button');
                mobileKbdArrowBtn.type = 'button';
                mobileKbdArrowBtn.className = 'row-mobile-arrow-btn';
                mobileKbdArrowBtn.innerHTML = '⌨️';
                mobileKbdArrowBtn.title = 'إضافة سطر جديد وفتح الكيبورد';

                if (isMobile) {
                    mobileKbdArrowBtn.style.display = 'flex';
                }

                mobileKbdArrowBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    addNewRowAndOpenTool(index, 'text');
                });

                const textInput = document.createElement('textarea');
                textInput.className = 'text-input';
                textInput.value = row.textExpression;
                textInput.rows = 1;

                if (index === activeRowIndex && activeFieldIndex === 'text') {
                    textInput.classList.add('text-border-active');
                }

                textInput.addEventListener('input', (e) => {
                    rows[index].textExpression = e.target.value;
                    e.target.style.height = 'auto';
                    e.target.style.height = (e.target.scrollHeight) + 'px';
                });

                textInput.addEventListener('focus', () => {
                    activeRowIndex = index;
                    activeFieldIndex = 'text';
                    updateActiveRowClasses();
                });

                textInput.addEventListener('keydown', (e) => {
                    handleKeyNavigation(e, index, 'text');
                });

                setupCellGestures(textInput, index, 'text');

                textWrapper.appendChild(mobileArrowBtn);
                textWrapper.appendChild(mobileKbdArrowBtn);
                textWrapper.appendChild(textInput);

                const outputContainer = document.createElement('div');
                outputContainer.className = 'calc-output-container';

                const outputDiv = document.createElement('div');
                outputDiv.className = 'calc-output';

                const currencySpan = document.createElement('span');
                currencySpan.className = 'row-currency';
                currencySpan.innerText = showCurrency ? 'جنيه' : '';

                if (row.result !== '' && row.result !== 0) {
                    const formatted = formatDisplayValue(row.result);
                    outputDiv.innerText = formatted.text;
                    if (formatted.isNegative) {
                        outputDiv.classList.add('negative');
                    } else {
                        outputDiv.classList.remove('negative');
                    }
                } else {
                    outputDiv.innerText = '';
                    currencySpan.innerText = '';
                }

                outputContainer.appendChild(outputDiv);
                outputContainer.appendChild(currencySpan);

                const calcWrapper = document.createElement('div');
                calcWrapper.className = 'calc-input-wrapper';

                if (isSelectionModeActive) {
                    const selectCheckbox = document.createElement('input');
                    selectCheckbox.type = 'checkbox';
                    selectCheckbox.className = 'calc-select-checkbox';
                    selectCheckbox.checked = !row.isCalcVisible;
                    selectCheckbox.title = 'علم هنا لإخفاء نص العملية الحسابية لهذا السطر';
                    
                    selectCheckbox.addEventListener('change', (e) => {
                        row.isCalcVisible = !e.target.checked;
                    });
                    
                    calcWrapper.appendChild(selectCheckbox);
                }

                const calcArrowBtn = document.createElement('button');
                calcArrowBtn.type = 'button';
                calcArrowBtn.className = 'row-calc-arrow-btn';
                calcArrowBtn.innerHTML = '🧮';
                calcArrowBtn.title = 'إضافة سطر جديد وفتح الآلة الحاسبة المصغرة';

                if (isMobile) {
                    calcArrowBtn.style.display = 'flex';
                }

                calcArrowBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    evaluateRow(index);
                    closeAllPads();
                    
                    let targetIndex;
                    if (index < rows.length - 1) {
                        targetIndex = index + 1;
                    } else {
                        rows.push({ 
                            textExpression: '', expression: '', result: 0, forceCalc: false, ignoreBeforeIndex: 0, 
                            isCalcVisible: true, isTextVisible: true, isMicVisible: true, isCalcPadVisible: false, isTextPadVisible: false
                        });
                        targetIndex = rows.length - 1;
                    }

                    activeRowIndex = targetIndex;
                    activeFieldIndex = 'calc';
                    rows[targetIndex].isCalcPadVisible = true;

                    renderCalculator('calc');
                    scrollToActiveRow();
                });

                const inputField = document.createElement('input');
                inputField.type = 'text';
                inputField.className = 'calc-input';
                inputField.value = row.expression;

                if (index === activeRowIndex && activeFieldIndex === 'calc') {
                    inputField.classList.add('calc-border-active');
                }

                inputField.addEventListener('input', (e) => {
                    rows[index].expression = e.target.value;
                    rows[index].forceCalc = false;
                    if (e.target.value.length < rows[index].ignoreBeforeIndex) {
                        rows[index].ignoreBeforeIndex = 0;
                    }
                    evaluateRow(index);
                });

                inputField.addEventListener('focus', () => {
                    activeRowIndex = index;
                    activeFieldIndex = 'calc';
                    updateActiveRowClasses();
                });

                inputField.addEventListener('keydown', (e) => {
                    if (e.key === 'Home') {
                        e.preventDefault();
                        rows[index].forceCalc = true;
                        rows[index].ignoreBeforeIndex = 0;
                        evaluateRow(index);
                        renderCalculator('calc');
                    }
                    else if (e.key === 'PageUp') {
                        e.preventDefault();
                        rows[index].ignoreBeforeIndex = inputField.selectionStart;
                        evaluateRow(index);
                        renderCalculator('calc');
                    }
                    else if (e.key === 'Delete') {
                        e.preventDefault();
                        clearCurrentField();
                    }
                    else {
                        handleKeyNavigation(e, index, 'calc');
                    }
                });

                setupCellGestures(inputField, index, 'calc');

                calcWrapper.appendChild(calcArrowBtn);
                calcWrapper.appendChild(inputField);

                inputsGroup.appendChild(textWrapper);
                inputsGroup.appendChild(outputContainer);
                inputsGroup.appendChild(calcWrapper);

                const micWrapper = document.createElement('div');
                micWrapper.className = 'mic-wrapper';

                if (isSelectionModeActive) {
                    const selectMicCheckbox = document.createElement('input');
                    selectMicCheckbox.type = 'checkbox';
                    selectMicCheckbox.className = 'calc-select-checkbox';
                    selectMicCheckbox.checked = !row.isMicVisible;
                    selectMicCheckbox.title = 'علم هنا لإخفاء المايك لهذا السطر';
                    
                    selectMicCheckbox.addEventListener('change', (e) => {
                        row.isMicVisible = !e.target.checked;
                    });
                    
                    micWrapper.appendChild(selectMicCheckbox);
                }

                const micBtn = document.createElement('button');
                micBtn.className = 'mic-btn';
                micBtn.innerHTML = '🎤';
                micBtn.title = 'تحدث للإدخال في الحقل النشط';
                micBtn.type = 'button';
                micBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    startSpeechRecognition(index, micBtn);
                });
                micWrapper.appendChild(micBtn);

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-row-btn';
                deleteBtn.innerHTML = '✕';
                deleteBtn.title = 'حذف السطر';
                deleteBtn.type = 'button';
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteRow(index);
                });

                rowMain.appendChild(inputsGroup);
                rowMain.appendChild(micWrapper);
                rowMain.appendChild(deleteBtn);
                rowDiv.appendChild(rowMain);

                if (index === activeRowIndex && (row.isTextPadVisible || row.isCalcPadVisible)) {
                    const keypadContainer = document.createElement('div');
                    keypadContainer.className = 'row-keypad-container';

                    if (row.isTextPadVisible) {
                        keypadContainer.appendChild(createMiniKeypad(index, 'text'));
                    }
                    if (row.isCalcPadVisible) {
                        keypadContainer.appendChild(createMiniKeypad(index, 'calc'));
                    }

                    screenContainer.appendChild(keypadContainer);
                }

                screenContainer.appendChild(rowDiv);

                setTimeout(() => {
                    textInput.style.height = 'auto';
                    textInput.style.height = (textInput.scrollHeight) + 'px';
                }, 0);

                if (typeof row.result === 'number' && !isNaN(row.result)) {
                    totalSum += row.result;
                    if (row.result > 0) {
                        positiveSum += row.result;
                    } else if (row.result < 0) {
                        negativeSum += row.result;
                    }
                }
            });

            if (!isMobile && focusTarget) {
                setTimeout(() => {
                    const targetEl = screenContainer.querySelector(`.calc-row.active .${focusTarget === 'text' ? 'text-input' : 'calc-input'}`);
                    if (targetEl) targetEl.focus();
                }, 10);
            }

            const formattedTotal = formatDisplayValue(Number.isInteger(totalSum) ? totalSum : parseFloat(totalSum.toFixed(6)));
            grandTotalEl.innerText = formattedTotal.text;
            grandTotalCurrencyEl.innerText = showCurrency ? 'جنيه' : '';
            
            if (formattedTotal.isNegative) {
                grandTotalEl.classList.add('negative');
            } else {
                grandTotalEl.classList.remove('negative');
            }

            const posFormatted = formatDisplayValue(Number.isInteger(positiveSum) ? positiveSum : parseFloat(positiveSum.toFixed(6)));
            const negFormatted = formatDisplayValue(Number.isInteger(negativeSum) ? negativeSum : parseFloat(negativeSum.toFixed(6)));

            positiveTotalValEl.innerText = showPositiveCheckbox.checked ? posFormatted.text : '';
            negativeTotalValEl.innerText = showNegativeCheckbox.checked ? negFormatted.text : '';
            
            updateGlobalHides();
        }

        function handleKeyNavigation(e, index, currentField) {
            const key = e.key;

            if (key === 'Enter') {
                e.preventDefault();
                evaluateRow(index);
                closeAllPads();

                if (index < rows.length - 1) {
                    activeRowIndex = index + 1;
                    activeFieldIndex = currentField;
                    renderCalculator(currentField);
                    scrollToActiveRow();
                } else {
                    rows.push({ 
                        textExpression: '', expression: '', result: 0, forceCalc: false, ignoreBeforeIndex: 0, 
                        isCalcVisible: true, isTextVisible: true, isMicVisible: true, isCalcPadVisible: false, isTextPadVisible: false
                    });
                    activeRowIndex = rows.length - 1;
                    activeFieldIndex = currentField;
                    renderCalculator(currentField);
                    screenContainer.scrollTop = screenContainer.scrollHeight;
                }
            }
            else if (key === 'ArrowDown') {
                if (index < rows.length - 1) {
                    e.preventDefault();
                    closeAllPads();
                    activeRowIndex = index + 1;
                    activeFieldIndex = currentField;
                    renderCalculator(currentField);
                    scrollToActiveRow();
                }
            } 
            else if (key === 'ArrowUp') {
                if (index > 0) {
                    e.preventDefault();
                    closeAllPads();
                    activeRowIndex = index - 1;
                    activeFieldIndex = currentField;
                    renderCalculator(currentField);
                    scrollToActiveRow();
                }
            } 
            else if (key === 'ArrowRight') {
                if (currentField === 'calc') {
                    e.preventDefault();
                    activeFieldIndex = 'text';
                    renderCalculator('text');
                }
            } 
            else if (key === 'ArrowLeft') {
                if (currentField === 'text') {
                    e.preventDefault();
                    activeFieldIndex = 'calc';
                    renderCalculator('calc');
                }
            }
        }

        function startSpeechRecognition(index, micBtn) {
            const targetRow = activeRowIndex;
            const targetField = activeFieldIndex;

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('متصفحك لا يدعم خاصية التعرف على الصوت.');
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            micBtn.classList.add('listening');
            micBtn.innerHTML = '🔴';

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                
                if (targetField === 'text') {
                    rows[targetRow].textExpression = rows[targetRow].textExpression ? rows[targetRow].textExpression + ' ' + speechToText : speechToText;
                    renderCalculator('text');
                } else {
                    rows[targetRow].expression = rows[targetRow].expression ? rows[targetRow].expression + ' ' + speechToText : speechToText;
                    rows[targetRow].forceCalc = false;
                    evaluateRow(targetRow);
                    renderCalculator('calc');
                }
            };

            recognition.onerror = () => {
                micBtn.classList.remove('listening');
                micBtn.innerHTML = '🎤';
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
                micBtn.innerHTML = '🎤';
            };

            recognition.start();
        }

        function updateActiveRowClasses() {
            const rowDivs = screenContainer.querySelectorAll('.calc-row');
            rowDivs.forEach((rowDiv, i) => {
                const textInput = rowDiv.querySelector('.text-input');
                const calcInput = rowDiv.querySelector('.calc-input');

                if (i === activeRowIndex) {
                    rowDiv.classList.add('active');
                    if (activeFieldIndex === 'text' && textInput) {
                        textInput.classList.add('text-border-active');
                        if (calcInput) calcInput.classList.remove('calc-border-active');
                    } else if (activeFieldIndex === 'calc' && calcInput) {
                        calcInput.classList.add('calc-border-active');
                        if (textInput) textInput.classList.remove('text-border-active');
                    }
                } else {
                    rowDiv.classList.remove('active');
                    if (textInput) textInput.classList.remove('text-border-active');
                    if (calcInput) calcInput.classList.remove('calc-border-active');
                }
            });
        }

        function deleteRow(index) {
            if (rows.length === 1) {
                rows[0].textExpression = '';
                rows[0].expression = '';
                rows[0].result = 0;
                rows[0].forceCalc = false;
                rows[0].ignoreBeforeIndex = 0;
                rows[0].isCalcVisible = true;
                rows[0].isTextVisible = true;
                rows[0].isMicVisible = true;
                rows[0].isCalcPadVisible = false;
                rows[0].isTextPadVisible = false;
            } else {
                rows.splice(index, 1);
                if (activeRowIndex >= rows.length) {
                    activeRowIndex = rows.length - 1;
                }
                closeAllPads();
            }
            renderCalculator('calc');
        }

        function evaluateRow(index) {
            let currentRow = rows[index];
            let fullExpr = currentRow.expression.trim();

            if (fullExpr === '') {
                currentRow.result = 0;
                updateGrandTotalOnly();
                return;
            }

            let expr = fullExpr;
            if (currentRow.ignoreBeforeIndex > 0) {
                expr = fullExpr.substring(currentRow.ignoreBeforeIndex).trim();
            }

            if (expr === '') {
                currentRow.result = 0;
                updateGrandTotalOnly();
                return;
            }

            let hasAttachedTextBeforeOrAfter = /(\d+[a-zA-Zأ-ي\u0600-\u06FF])|([a-zA-Zأ-ي\u0600-\u06FF]\d+)/.test(expr);

            if (hasAttachedTextBeforeOrAfter && !currentRow.forceCalc) {
                currentRow.result = 0;
                updateGrandTotalOnly();
                return;
            }

            let percentMatch = expr.match(/^([\d.]+)\s*([\+\-\*\/])\s*([\d.]+)%$/);
            if (percentMatch) {
                let baseNum = parseFloat(percentMatch[1]);
                let operator = percentMatch[2];
                let percentVal = parseFloat(percentMatch[3]);
                let calculatedPercent = baseNum * (percentVal / 100);
                let res = 0;

                if (operator === '+') {
                    res = baseNum + calculatedPercent;
                } else if (operator === '-') {
                    res = baseNum - calculatedPercent;
                } else if (operator === '*') {
                    res = calculatedPercent;
                } else if (operator === '/') {
                    res = calculatedPercent !== 0 ? baseNum / calculatedPercent : 0;
                }

                currentRow.result = Number.isInteger(res) ? res : parseFloat(res.toFixed(6));
                updateGrandTotalOnly();
                return;
            }

            let sanitizedExpr = expr
                .replace(/×/g, '*')
                .replace(/÷/g, '/');

            let validMathPattern = /^[0-9+\-*/.\s()a-zA-Zأ-ي\u0600-\u06FF%]+$/;

            if (validMathPattern.test(sanitizedExpr)) {
                try {
                    let singleNegativeMatch = expr.match(/^-\s*([\d.]+)$/);
                    if (singleNegativeMatch) {
                        let res = -parseFloat(singleNegativeMatch[1]);
                        currentRow.result = Number.isInteger(res) ? res : parseFloat(res.toFixed(6));
                        updateGrandTotalOnly();
                        return;
                    }

                    let evalSafeExpr = sanitizedExpr.replace(/[^0-9+\-*/().]/g, '');
                    let res = Function('"use strict"; return (' + evalSafeExpr + ')')();

                    if (isNaN(res) || !isFinite(res)) {
                        currentRow.result = 0;
                    } else {
                        currentRow.result = Number.isInteger(res) ? res : parseFloat(res.toFixed(6));
                    }
                } catch (e) {
                    currentRow.result = 0;
                }
            } else {
                currentRow.result = 0;
            }
            
            updateGrandTotalOnly();
        }

        function updateGrandTotalOnly() {
            let totalSum = 0;
            let positiveSum = 0;
            let negativeSum = 0;
            const showCurrency = showCurrencyCheckbox.checked;

            rows.forEach((row, index) => {
                const rowDivs = screenContainer.querySelectorAll('.calc-row');
                if (rowDivs[index]) {
                    const outputDiv = rowDivs[index].querySelector('.calc-output');
                    const currencySpan = rowDivs[index].querySelector('.row-currency');

                    if (row.result !== '' && row.result !== 0) {
                        const formatted = formatDisplayValue(row.result);
                        outputDiv.innerText = formatted.text;
                        currencySpan.innerText = showCurrency ? 'جنيه' : '';
                        if (formatted.isNegative) {
                            outputDiv.classList.add('negative');
                        } else {
                            outputDiv.classList.remove('negative');
                        }
                    } else {
                        outputDiv.innerText = '';
                        currencySpan.innerText = '';
                    }
                }
                if (typeof row.result === 'number' && !isNaN(row.result)) {
                    totalSum += row.result;
                    if (row.result > 0) {
                        positiveSum += row.result;
                    } else if (row.result < 0) {
                        negativeSum += row.result;
                    }
                }
            });

            const formattedTotal = formatDisplayValue(Number.isInteger(totalSum) ? totalSum : parseFloat(totalSum.toFixed(6)));
            grandTotalEl.innerText = formattedTotal.text;
            grandTotalCurrencyEl.innerText = showCurrency ? 'جنيه' : '';

            if (formattedTotal.isNegative) {
                grandTotalEl.classList.add('negative');
            } else {
                grandTotalEl.classList.remove('negative');
            }

            const posFormatted = formatDisplayValue(Number.isInteger(positiveSum) ? positiveSum : parseFloat(positiveSum.toFixed(6)));
            const negFormatted = formatDisplayValue(Number.isInteger(negativeSum) ? negativeSum : parseFloat(negativeSum.toFixed(6)));

            positiveTotalValEl.innerText = showPositiveCheckbox.checked ? posFormatted.text : '';
            negativeTotalValEl.innerText = showNegativeCheckbox.checked ? negFormatted.text : '';
        }

        function generateShareSummaryText() {
            const showCurrency = showCurrencyCheckbox.checked;
            let text = "";

            rows.forEach((r, i) => {
                let note = (r.isTextVisible && r.textExpression) ? `[${r.textExpression}]` : `[سطر ${i+1}]`;
                let calc = (r.isCalcVisible && r.expression) ? `= ${r.expression}` : '';
                let res = r.result !== 0 ? `← ${r.result} ${showCurrency ? 'جنيه' : ''}` : '';
                
                text += `${i + 1}. ${note} ${calc} ${res}\n`;
            });

            text += "-------------------------\n";
            if (grandTotalEl.style.display !== 'none') {
                text += `💰 *الإجمالي النهائي:* ${grandTotalEl.innerText} ${grandTotalCurrencyEl.style.display !== 'none' && showCurrency ? 'جنيه' : ''}\n`;
            }
            return text;
        }

        function copyTextToClipboard(text, successMessage) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    if (successMessage) alert(successMessage);
                }).catch(() => {
                    fallbackCopyText(text, successMessage);
                });
            } else {
                fallbackCopyText(text, successMessage);
            }
        }

        function fallbackCopyText(text, successMessage) {
            const dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = text;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);
            if (successMessage) alert(successMessage);
        }

        // الوظائف الجديدة والقديمة للتصدير والمشاركة
        function openPhoneWhatsApp() {
            window.location.href = "whatsapp://";
        }

        function openPhoneMessenger() {
            window.location.href = "fb-messenger://";
        }

        function copyReportTextOnly() {
            const text = generateShareSummaryText();
            copyTextToClipboard(text, "تم نسخ التقرير نصياً بنجاح! يمكنك لصقه في أي مكان الآن.");
        }

        function shareLinkToWhatsApp() {
            const text = generateShareSummaryText();
            copyTextToClipboard(text, "تم نسخ التقرير للحافظة بنجاح!\nسيفتح موقع/تطبيق الواتساب الآن.");
            const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
            window.open(whatsappUrl, '_blank');
        }

        function shareLinkToMessenger() {
            const text = generateShareSummaryText();
            copyTextToClipboard(text, "تم نسخ التقرير للحافظة بنجاح!\nسيفتح موقع الماسنجر الآن، قم بالدخول للمحادثة واضغط لصق (Ctrl + V).");
