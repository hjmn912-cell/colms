            window.open('https://www.messenger.com/', '_blank');
        }

        function shareLinkToSMS() {
            const text = generateShareSummaryText();
            copyTextToClipboard(text, "تم نسخ التقرير للحافظة بنجاح!\nسيتم فتح برنامج الرسائل النصية (SMS) الآن.");
            const smsUrl = `sms:?body=${encodeURIComponent(text)}`;
            window.open(smsUrl, '_blank');
        }

        function exportToTXT() {
            const text = generateShareSummaryText();
            let blob = new Blob([text], { type: "text/plain;charset=utf-8" });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = 'Calculator_Results.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function exportToExcel() {
            const showCurrency = showCurrencyCheckbox.checked;
            let dataToExport = rows.map((r, i) => ({
                "السطر": i + 1,
                "العمود النصي / الملاحظات (اليمين)": r.isTextVisible ? r.textExpression : '',
                "النتيجة (الوسط)": showCurrency ? `${r.result} جنيه` : r.result,
                "العملية الحسابية (اليسار)": r.isCalcVisible ? r.expression : ''
            }));
            
            const worksheet = XLSX.utils.json_to_sheet(dataToExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "النتائج");
            XLSX.writeFile(workbook, "Calculator_Results.xlsx");
        }

        function exportToWord() {
            const showCurrency = showCurrencyCheckbox.checked;
            let htmlContent = `<html dir="rtl"><head><meta charset='utf-8'></head><body>`;
            htmlContent += `<table border="1" style="border-collapse:collapse; width:100%;">`;
            htmlContent += `<tr><th>السطر</th><th>الملاحظات (اليمين)</th><th>النتيجة (الوسط)</th><th>العملية الحسابية (اليسار)</th></tr>`;
            
            rows.forEach((r, i) => {
                let textText = r.isTextVisible ? r.textExpression : '';
                let exprText = r.isCalcVisible ? r.expression : '';
                let resText = showCurrency ? `${r.result} جنيه` : r.result;
                htmlContent += `<tr><td>${i+1}</td><td>${textText}</td><td>${resText}</td><td>${exprText}</td></tr>`;
            });
            
            htmlContent += `</table></body></html>`;

            let blob = new Blob(['\ufeff' + htmlContent], {
                type: 'application/msword'
            });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = 'Calculator_Results.doc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function exportToPDF() {
            const opt = {
                margin:       10,
                filename:     'Calculator_Results.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(calculatorContainer).set(opt).save();
        }

        function exportToImage() {
            const dropdown = document.getElementById('exportDropdown');
            dropdown.classList.remove('active');
            dropdown.style.display = 'none';

            html2canvas(calculatorContainer).then(canvas => {
                let link = document.createElement('a');
                link.download = 'Calculator_Results.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                dropdown.style.display = 'inline-block';
            });
        }

        document.addEventListener('keydown', (event) => {
            const key = event.key;

            if (key === 'Escape') {
                rows = [{ 
                    textExpression: '', expression: '', result: 0, forceCalc: false, ignoreBeforeIndex: 0, 
                    isCalcVisible: true, isTextVisible: true, isMicVisible: true, isCalcPadVisible: false, isTextPadVisible: false
                }];
                activeRowIndex = 0;
                activeFieldIndex = 'calc';
                renderCalculator('calc');
            }
            else if (key === 'Backspace') {
                const activeInput = document.activeElement;
                if (activeInput && (activeInput.classList.contains('calc-input') || activeInput.classList.contains('text-input'))) {
                    if (activeInput.value === '' && activeRowIndex > 0) {
                        event.preventDefault();
                        rows.splice(activeRowIndex, 1);
                        activeRowIndex--;
                        closeAllPads();
                        activeFieldIndex = 'calc';
                        renderCalculator('calc');
                    }
                }
            }
        });

        renderCalculator('calc');
    </script>
