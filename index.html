<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>آلة حاسبة الأسطر المتعددة</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .calculator-container {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            background-color: #111827;
            border-radius: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid #334155;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }

        .resize-edge {
            position: absolute;
            z-index: 10000;
        }
        .resize-edge.right { top: 0; right: 0; width: 12px; height: 100%; cursor: e-resize; }
        .resize-edge.left { top: 0; left: 0; width: 12px; height: 100%; cursor: w-resize; }
        .resize-edge.bottom { bottom: 0; left: 0; width: 100%; height: 12px; cursor: s-resize; }
        .resize-edge.corner-br { bottom: 0; right: 0; width: 20px; height: 20px; cursor: nwse-resize; }

        .all-top-header-wrapper {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background-color: #030712;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
        }

        .sticky-top-section {
            position: relative;
            background-color: #030712;
            width: 100%;
        }

        .calculator-header {
            background-color: #030712;
            padding: 8px 12px;
            border-bottom: 2px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 8px;
            position: relative;
        }

        .header-right-group {
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: flex-end;
            width: 100%;
            flex-wrap: wrap;
        }

        .designer-credit {
            font-size: 0.7rem;
            color: #6b7280;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .auto-save-indicator {
            background-color: #065f46;
            color: #34d399;
            border: 1px solid #059669;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        /* زر حذف الكل الجديد */
        .clear-all-btn {
            background-color: #7f1d1d;
            color: #fca5a5;
            border: 1px solid #ef4444;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .clear-all-btn:hover {
            background-color: #ef4444;
            color: #fff;
        }

        .top-action-btn, .top-notes-focus-btn, .toggle-hide-btn, .top-next-row-btn {
            background-color: #1e293b;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .export-dropdown {
            position: relative;
            display: inline-block;
            text-align: left;
        }

        .export-btn {
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .export-btn:hover { background-color: #38bdf8; color: #0b0f19; }

        .dropdown-content {
            display: none; position: absolute; left: 0; background-color: #1e293b;
            min-width: 220px; box-shadow: 0px 8px 16px rgba(0,0,0,0.5); border-radius: 6px; z-index: 2000; border: 1px solid #38bdf8;
        }
        .dropdown-content button {
            color: #f8fafc; padding: 8px 12px; display: flex; align-items: center; gap: 8px;
            width: 100%; text-align: right; background: none; border: none; cursor: pointer; font-size: 0.85rem; border-bottom: 1px solid #334155;
        }
        .dropdown-content button:hover { background-color: #38bdf8; color: #0b0f19; }
        .export-dropdown.active .dropdown-content { display: block; }

        .calculator-screen {
            background-color: #0f172a;
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden;
            gap: 8px;
            width: 100%;
        }

        .calc-row {
            display: flex;
            flex-direction: column;
            background-color: #1e293b;
            padding: 10px 8px;
            border-radius: 8px;
            border: 1px solid transparent;
            transition: border-color 0.15s ease;
            gap: 8px;
            width: 100%;
        }

        .calc-row.active {
            border-color: #38bdf8;
        }

        .calc-row-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .inputs-group {
            display: flex;
            gap: 6px;
            flex-grow: 1;
            align-items: center;
            width: 100%;
        }

        .text-input-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 3.2; 
        }

        .calc-input-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 2.2; 
        }

        /* زر المايك وزر حذف السطر */
        .row-action-btns {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .row-mic-btn, .row-delete-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            font-size: 0.8rem;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .row-delete-btn {
            background: rgba(239, 68, 68, 0.15);
            border-color: #ef4444;
            color: #ef4444;
        }
        .row-delete-btn:hover {
            background-color: #ef4444;
            color: #fff;
        }

        .row-mic-btn.recording {
            background-color: #ef4444 !important;
            border-color: #f87171 !important;
            color: #fff !important;
            animation: pulseMic 1s infinite;
        }

        @keyframes pulseMic {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .text-input, .calc-input {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid #334155;
            border-radius: 6px;
            padding: 8px;
            color: #38bdf8;
            font-size: 1.3rem;
            font-weight: bold;
            outline: none;
            width: 100%;
        }

        .text-input { flex: 1; resize: none; min-height: 42px; }
        .calc-input { width: 100%; height: 42px; direction: ltr; text-align: right; }

        .text-border-active, .calc-border-active {
            border-color: #38bdf8 !important;
            background: rgba(56, 189, 248, 0.1) !important;
        }

        .calc-output-container {
            display: flex;
            align-items: baseline;
            gap: 4px;
            min-width: 85px;
            text-align: left;
        }

        .calc-output {
            font-size: 1.25rem;
            font-weight: 700;
            color: #10b981;
        }
        .calc-output.negative { color: #ef4444 !important; }

        .row-currency { font-size: 0.9rem; color: #38bdf8; }

        .keyboard-hint {
            padding: 6px 10px;
            text-align: center;
            font-size: 0.75rem;
            color: #6b7280;
            background-color: #111827;
            border-top: 1px solid #1f2937;
            width: 100%;
        }
        .keyboard-hint span { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

    <div class="calculator-container" id="calculatorContainer">
        
        <div class="resize-edge right" id="edgeRight"></div>
        <div class="resize-edge left" id="edgeLeft"></div>
        <div class="resize-edge bottom" id="edgeBottom"></div>
        <div class="resize-edge corner-br" id="edgeCornerBR"></div>

        <div class="all-top-header-wrapper">
            <div class="calculator-header">
                <div class="header-right-group">
                    <span class="designer-credit">designed by Sami Arouj</span>
                    <div class="auto-save-indicator" id="saveStatus">🟢 الحفظ التلقائي مفعّل</div>
                    
                    <!-- زر حذف الكل والبداية من جديد -->
                    <button type="button" class="clear-all-btn" title="حذف كل الأسطر والبدء من جديد" onclick="clearAllRows()">
                        🗑️ حذف الكل
                    </button>

                    <div class="export-dropdown" id="exportDropdown">
                        <button class="export-btn" title="تصدير ومشاركة" onclick="toggleExportMenu(event)">📊</button>
                        <div class="dropdown-content">
                            <button onclick="exportToExcel()">📊 إكسيل (Excel)</button>
                            <button onclick="exportToPDF()">📄 بي دي إف (PDF)</button>
                            <button onclick="exportToTXT()">📄 تصدير ملف نصي (TXT)</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="screenContainer" class="calculator-screen"></div>

        <div class="keyboard-hint">
            <span>Enter:</span> انتقال للسطر اللي تحته مع تركيز الماوس | <span>Delete:</span> مسح محتوى الخلية
        </div>
    </div>

    <script>
        const GOOGLE_SHEET_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyFOebKurx2wJpj8FzmZipkHM3c24GiQ_SS47TGPj3YSAxS_V7v81PNqwxdnIxqZCkH/exec";

        const screenContainer = document.getElementById('screenContainer');
        const calculatorContainer = document.getElementById('calculatorContainer');
        const saveStatusEl = document.getElementById('saveStatus');

        let rows = [
            { textExpression: '', expression: '', result: 0 }
        ];
        let activeRowIndex = 0;
        let activeFieldIndex = 'calc';
        let saveTimeouts = {};

        // الحفظ التلقائي في الشيت
        function autoSaveRow(index) {
            const rowDivs = screenContainer.querySelectorAll('.calc-row');
            if (!rowDivs[index]) return;

            const textInput = rowDivs[index].querySelector('.text-input').value;
            const calcInput = rowDivs[index].querySelector('.calc-input').value;
            const resultVal = rowDivs[index].querySelector('.calc-output').innerText;

            saveStatusEl.innerText = "⏳ جاري الحفظ...";
            saveStatusEl.style.backgroundColor = "#78350f";
            saveStatusEl.style.color = "#fcd34d";

            fetch(GOOGLE_SHEET_WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    rowIndex: index, 
                    note: textInput, 
                    calc: calcInput,
                    result: resultVal
                })
            }).then(() => {
                saveStatusEl.innerText = "🟢 تم الحفظ";
                saveStatusEl.style.backgroundColor = "#065f46";
                saveStatusEl.style.color = "#34d399";
            }).catch(err => {
                console.error("خطأ بالحفظ:", err);
                saveStatusEl.innerText = "🔴 خطأ في الحفظ";
                saveStatusEl.style.backgroundColor = "#7f1d1d";
                saveStatusEl.style.color = "#fca5a5";
            });
        }

        // جلب البيانات عند التحديث
        async function loadDataFromGoogleSheet() {
            try {
                const response = await fetch(GOOGLE_SHEET_WEB_APP_URL);
                const data = await response.json();

                if (data && data.length > 0) {
                    rows = data.map(item => ({
                        textExpression: item.note || '',
                        expression: item.calc || '',
                        result: parseFloat(item.result) || 0
                    }));
                    activeRowIndex = 0;
                    renderCalculator();
                }
            } catch (err) {
                console.error("خطأ أثناء جلب البيانات:", err);
            }
        }

        window.onload = function() {
            loadDataFromGoogleSheet();
        };

        // زر حذف الكل والبدء من جديد
        function clearAllRows() {
            if (confirm("هل أنت متأكد من حذف كل الأسطر والبدء من جديد؟")) {
                rows = [{ textExpression: '', expression: '', result: 0 }];
                activeRowIndex = 0;
                activeFieldIndex = 'calc';
                renderCalculator();
                // تحديث الشيت بإفراغ السطر الأول وإلغاء الباقي
                autoSaveRow(0);
                alert("تم البدء من جديد بنجاح!");
            }
        }

        // حذف سطر محدد بواسطة زر الحذف (🗑️) بجانب المايك
        function deleteSpecificRow(index) {
            if (rows.length === 1) {
                rows[0].textExpression = '';
                rows[0].expression = '';
                rows[0].result = 0;
            } else {
                rows.splice(index, 1);
                if (activeRowIndex >= rows.length) {
                    activeRowIndex = rows.length - 1;
                }
            }
            renderCalculator();
            autoSaveRow(index);
        }

        function renderCalculator() {
            screenContainer.innerHTML = '';

            rows.forEach((row, index) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = `calc-row ${index === activeRowIndex ? 'active' : ''}`;

                rowDiv.innerHTML = `
                    <div class="calc-row-main">
                        <div class="inputs-group">
                            <div class="text-input-wrapper">
                                <textarea class="text-input" rows="1">${row.textExpression}</textarea>
                            </div>
                            <div class="calc-output-container">
                                <div class="calc-output">${row.result || 0}</div>
                                <span class="row-currency">جنيه</span>
                            </div>
                            <div class="calc-input-wrapper">
                                <input type="text" class="calc-input" value="${row.expression}">
                                <div class="row-action-btns">
                                    <button type="button" class="row-mic-btn" title="إملاء صوتي">🎤</button>
                                    <button type="button" class="row-delete-btn" title="حذف السطر">🗑️</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                const textInput = rowDiv.querySelector('.text-input');
                const calcInput = rowDiv.querySelector('.calc-input');
                const micBtn = rowDiv.querySelector('.row-mic-btn');
                const deleteBtn = rowDiv.querySelector('.row-delete-btn');

                // أحداث الملاحظات
                textInput.addEventListener('input', (e) => {
                    rows[index].textExpression = e.target.value;
                    e.target.style.height = 'auto'; 
                    e.target.style.height = (e.target.scrollHeight) + 'px';
                    clearTimeout(saveTimeouts[index]);
                    saveTimeouts[index] = setTimeout(() => autoSaveRow(index), 800);
                });

                textInput.addEventListener('focus', () => {
                    activeRowIndex = index;
                    activeFieldIndex = 'text';
                    updateActiveRowClasses();
                });

                // أحداث العمليات والحساب
                calcInput.addEventListener('input', (e) => {
                    let rawVal = e.target.value.replace(/x|X|×/g, '*');
                    e.target.value = rawVal.replace(/\*/g, 'x');
                    rows[index].expression = rawVal;
                    evaluateRow(index);
                    clearTimeout(saveTimeouts[index]);
                    saveTimeouts[index] = setTimeout(() => autoSaveRow(index), 800);
                });

                calcInput.addEventListener('focus', () => {
                    activeRowIndex = index;
                    activeFieldIndex = 'calc';
                    updateActiveRowClasses();
                });

                // زر حذف السطر
                deleteBtn.addEventListener('click', () => {
                    deleteSpecificRow(index);
                });

                // زر المايك
                micBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    startVoiceRecognition(index, micBtn);
                });

                screenContainer.appendChild(rowDiv);

                setTimeout(() => {
                    textInput.style.height = 'auto';
                    textInput.style.height = (textInput.scrollHeight) + 'px';
                }, 0);
            });

            // تركيز الماوس (Focus) تلقائياً على الخلية النشطة الحالية
            setTimeout(() => {
                const activeRowEl = screenContainer.children[activeRowIndex];
                if (activeRowEl) {
                    const targetInput = activeRowEl.querySelector(activeFieldIndex === 'text' ? '.text-input' : '.calc-input');
                    if (targetInput && document.activeElement !== targetInput) {
                        targetInput.focus();
                    }
                }
            }, 50);
        }

        // الانتقال بالـ Enter للخلية أسفلها مباشرة وتنشيطها
        window.addEventListener('keydown', (event) => {
            const key = event.key;
            const activeInput = document.activeElement;
            const isAnInputFocused = activeInput && (activeInput.classList.contains('calc-input') || activeInput.classList.contains('text-input'));

            if (key === 'Delete' && isAnInputFocused) {
                event.preventDefault();
                if (activeInput.classList.contains('text-input')) {
                    rows[activeRowIndex].textExpression = '';
                } else {
                    rows[activeRowIndex].expression = '';
                    rows[activeRowIndex].result = 0;
                }
                renderCalculator();
                autoSaveRow(activeRowIndex);
                return;
            }

            if (key === 'Enter') {
                event.preventDefault();
                evaluateRow(activeRowIndex);

                if (activeRowIndex < rows.length - 1) {
                    activeRowIndex++;
                } else {
                    rows.push({ textExpression: '', expression: '', result: 0 });
                    activeRowIndex = rows.length - 1;
                }
                renderCalculator();
                scrollToActiveRow();
                return;
            }

            if (key === 'ArrowDown') {
                event.preventDefault();
                if (activeRowIndex < rows.length - 1) {
                    activeRowIndex++;
                    renderCalculator();
                    scrollToActiveRow();
                }
                return;
            }

            if (key === 'ArrowUp') {
                event.preventDefault();
                if (activeRowIndex > 0) {
                    activeRowIndex--;
                    renderCalculator();
                    scrollToActiveRow();
                }
                return;
            }
        });

        function updateActiveRowClasses() {
            const rowDivs = screenContainer.querySelectorAll('.calc-row');
            rowDivs.forEach((rowDiv, i) => {
                const textInput = rowDiv.querySelector('.text-input');
                const calcInput = rowDiv.querySelector('.calc-input');
                if (i === activeRowIndex) {
                    rowDiv.classList.add('active');
                    if (activeFieldIndex === 'text' && textInput) {
                        textInput.classList.add('text-border-active');
                        if (calcInput) calcInput.classList.remove('calc-border-active');
                    } else if (activeFieldIndex === 'calc' && calcInput) {
                        calcInput.classList.add('calc-border-active');
                        if (textInput) textInput.classList.remove('text-border-active');
                    }
                } else {
                    rowDiv.classList.remove('active');
                    if (textInput) textInput.classList.remove('text-border-active');
                    if (calcInput) calcInput.classList.remove('calc-border-active');
                }
            });
        }

        function scrollToActiveRow() {
            const activeRowEl = screenContainer.children[activeRowIndex];
            if (activeRowEl) {
                activeRowEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function evaluateRow(index) {
            let currentRow = rows[index];
            let fullExpr = currentRow.expression.trim();
            if (fullExpr === '') {
                currentRow.result = 0;
                updateOutputDisplay(index);
                return;
            }

            let sanitizedExpr = fullExpr.replace(/x|X|×|\*/g, '*').replace(/÷/g, '/');
            try {
                let evalSafeExpr = sanitizedExpr.replace(/[^0-9+\-*/().]/g, '');
                let res = Function('"use strict"; return (' + evalSafeExpr + ')')();
                currentRow.result = (isNaN(res) || !isFinite(res)) ? 0 : (Number.isInteger(res) ? res : parseFloat(res.toFixed(6)));
            } catch (e) {
                currentRow.result = 0;
            }
            updateOutputDisplay(index);
        }

        function updateOutputDisplay(index) {
            const rowDivs = screenContainer.querySelectorAll('.calc-row');
            if (rowDivs[index]) {
                const outputDiv = rowDivs[index].querySelector('.calc-output');
                const res = rows[index].result;
                outputDiv.innerText = res;
                if (res < 0) outputDiv.classList.add('negative');
                else outputDiv.classList.remove('negative');
            }
        }

        function startVoiceRecognition(index, micBtnEl) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("متصفحك لا يدعم التعرف على الصوت."); return; }
            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-EG';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            micBtnEl.classList.add('recording');

            recognition.onresult = (event) => {
                const speechResult = event.results[0][0].transcript;
                micBtnEl.classList.remove('recording');
                if (activeFieldIndex === 'text') {
                    rows[index].textExpression += speechResult;
                } else {
                    let cleaned = speechResult.replace(/في|ضرب|علامة في/g, '*').replace(/على|قسمة/g, '/').replace(/زائد|جمع/g, '+').replace(/ناقص|طرح/g, '-');
                    rows[index].expression += cleaned;
                    evaluateRow(index);
                }
                renderCalculator();
                autoSaveRow(index);
            };
            recognition.onerror = () => micBtnEl.classList.remove('recording');
            recognition.onend = () => micBtnEl.classList.remove('recording');
            recognition.start();
        }

        function toggleExportMenu(e) {
            e.stopPropagation();
            document.getElementById('exportDropdown').classList.toggle('active');
        }

        window.addEventListener('click', () => {
            const dropdown = document.getElementById('exportDropdown');
            if (dropdown) dropdown.classList.remove('active');
        });

        function exportToExcel() {
            let dataToExport = rows.map((r, i) => ({ "السطر": i + 1, "الملاحظات": r.textExpression, "النتيجة": r.result, "العملية": r.expression }));
            const worksheet = XLSX.utils.json_to_sheet(dataToExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "النتائج");
            XLSX.writeFile(workbook, "Calculator_Results.xlsx");
        }

        function exportToPDF() {
            html2pdf().from(calculatorContainer).save('Calculator_Results.pdf');
        }

        function exportToTXT() {
            let text = rows.map((r, i) => `${i+1}. [${r.textExpression}] = ${r.expression} ← ${r.result}`).join('\n');
            let blob = new Blob([text], { type: "text/plain;charset=utf-8" });
            let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Calculator_Results.txt'; a.click();
        }
    </script>
</body>
</html>
